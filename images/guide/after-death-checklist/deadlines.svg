<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="기한 막대그래프: 사망신고 1개월, 상속포기·한정승인 3개월, 상속세 신고 6개월, 안심상속 1년">
<style>
  .t{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  @keyframes grow{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
  @keyframes fade{0%,60%{opacity:0}100%{opacity:1}}
  .bar{transform-box:fill-box;transform-origin:left;animation:grow 1.2s cubic-bezier(.2,.7,.2,1) both}
  .lb{animation:fade 1.8s ease-out both}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style>
<rect width="1200" height="560" fill="#ffffff"/>
<text x="60" y="70" class="t" font-size="34" font-weight="900" fill="#0f1b3d">사망 후 기한, 짧은 것부터</text>
<g class="t" font-size="20" fill="#94a3b8" text-anchor="middle">
  <line x1="390" y1="110" x2="390" y2="500" stroke="#e2e8f0" stroke-width="2"/><text x="390" y="530">0</text>
  <line x1="451" y1="110" x2="451" y2="500" stroke="#e2e8f0" stroke-width="2"/><text x="451" y="530">1개월</text>
  <line x1="573" y1="110" x2="573" y2="500" stroke="#e2e8f0" stroke-width="2"/><text x="573" y="530">3개월</text>
  <line x1="755" y1="110" x2="755" y2="500" stroke="#e2e8f0" stroke-width="2"/><text x="755" y="530">6개월</text>
  <line x1="1120" y1="110" x2="1120" y2="500" stroke="#e2e8f0" stroke-width="2"/><text x="1120" y="530">1년</text>
</g>
<g class="t" font-size="26" font-weight="800" fill="#1e293b">
  <text x="60" y="168">사망신고</text>
  <text x="60" y="264">상속포기 · 한정승인</text>
  <text x="60" y="360">상속세 신고</text>
  <text x="60" y="456">안심상속 조회</text>
</g>
<rect class="bar" style="animation-delay:.1s" x="390" y="138" width="61" height="44" rx="10" fill="#dc2626"/>
<rect class="bar" style="animation-delay:.4s" x="390" y="234" width="183" height="44" rx="10" fill="#ea580c"/>
<rect class="bar" style="animation-delay:.7s" x="390" y="330" width="365" height="44" rx="10" fill="#eab308"/>
<rect class="bar" style="animation-delay:1s" x="390" y="426" width="730" height="44" rx="10" fill="#2563eb"/>
<g class="t lb" font-size="20" font-weight="700" fill="#475569">
  <text x="466" y="168">안 날부터 · 늦으면 과태료</text>
  <text x="588" y="264">상속개시를 안 날부터 · 가정법원</text>
  <text x="770" y="360">사망한 달 말일부터</text>
  <text x="410" y="456" fill="#ffffff">사망한 달 말일부터 · 정부24/주민센터</text>
</g>
</svg>
