<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="봉안당은 유골함을 안치단에 모시고, 수목장은 골분을 나무 아래 30cm 이상 깊이에 묻는 방식 비교 그림">
<style>
  .t{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  @keyframes drop{0%{transform:translateY(-40px);opacity:0}30%{opacity:1}70%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:1}}
  @keyframes sink{0%{transform:translateY(-70px);opacity:0}25%{opacity:1}65%,100%{transform:translateY(0);opacity:1}}
  @keyframes hl{0%,100%{opacity:.4}50%{opacity:1}}
  .urn{animation:drop 5s ease-out infinite}
  .dust{animation:sink 5s ease-out infinite}
  .hl{animation:hl 2.6s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1000" height="560" rx="24" fill="#0f1b33"/>
<line x1="500" y1="40" x2="500" y2="520" stroke="#2a3a5c" stroke-width="2" stroke-dasharray="6 6"/>
<!-- 왼쪽 봉안당 -->
<text class="t" x="250" y="62" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">봉안당 (봉안시설)</text>
<text class="t" x="250" y="92" text-anchor="middle" font-size="16" fill="#94a3b8">유골함을 안치단에 모십니다</text>
<rect x="110" y="120" width="280" height="290" rx="10" fill="#1e2b47" stroke="#334a78"/>
<g fill="#24365a" stroke="#3b5285">
  <rect x="130" y="140" width="72" height="80"/><rect x="214" y="140" width="72" height="80"/><rect x="298" y="140" width="72" height="80"/>
  <rect x="130" y="232" width="72" height="80"/><rect x="214" y="232" width="72" height="80" stroke="#fcd34d" stroke-width="3" class="hl"/><rect x="298" y="232" width="72" height="80"/>
  <rect x="130" y="324" width="72" height="72"/><rect x="214" y="324" width="72" height="72"/><rect x="298" y="324" width="72" height="72"/>
</g>
<g class="urn"><path d="M234 300 h32 v-30 q0-14 -16-14 q-16 0 -16 14z" fill="#e2e8f0"/><rect x="242" y="250" width="16" height="8" rx="2" fill="#cbd5e1"/></g>
<g class="t" font-size="16" fill="#e2e8f0">
  <text x="110" y="448">· 실내 참배, 날씨 영향 적음</text>
  <text x="110" y="476">· 유골함째 모셔 나중에 옮기기 쉬움</text>
  <text x="110" y="504">· 사용 기간·관리비 조건 확인 필요</text>
</g>
<!-- 오른쪽 수목장 -->
<text class="t" x="750" y="62" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">수목장 (자연장)</text>
<text class="t" x="750" y="92" text-anchor="middle" font-size="16" fill="#94a3b8">골분을 나무 아래에 묻습니다</text>
<rect x="560" y="280" width="380" height="130" fill="#3b2f25"/>
<rect x="560" y="272" width="380" height="12" fill="#3f6b4f"/>
<path d="M750 276 C 748 240, 756 215, 750 180" stroke="#6b5240" stroke-width="12" fill="none" stroke-linecap="round"/>
<circle cx="750" cy="150" r="48" fill="#2f6b4f"/><circle cx="712" cy="172" r="32" fill="#3a7d5c"/><circle cx="790" cy="168" r="34" fill="#3a7d5c"/>
<g stroke="#6b5240" stroke-width="4" fill="none"><path d="M750 284 q-30 30 -60 40"/><path d="M750 284 q25 35 55 45"/></g>
<g class="dust"><ellipse cx="750" cy="352" rx="34" ry="12" fill="#e5d9c3" opacity=".9"/><g fill="#f5ecda"><circle cx="735" cy="348" r="3"/><circle cx="758" cy="354" r="3"/><circle cx="770" cy="347" r="2.5"/></g></g>
<g class="hl"><line x1="880" y1="284" x2="880" y2="350" stroke="#fcd34d" stroke-width="2"/><path d="M874 290 L880 284 L886 290 M874 344 L880 350 L886 344" stroke="#fcd34d" stroke-width="2" fill="none"/>
<text class="t" x="892" y="324" font-size="15" font-weight="700" fill="#fcd34d">30cm↑</text></g>
<rect x="796" y="226" width="30" height="16" rx="3" fill="#e2e8f0"/><text class="t" x="811" y="238" text-anchor="middle" font-size="9" fill="#0f172a">표지</text>
<g class="t" font-size="16" fill="#e2e8f0">
  <text x="560" y="448">· 자연 속에 모시는 방식</text>
  <text x="560" y="476">· 흙과 섞여 나중에 수습이 어려울 수 있음</text>
  <text x="560" y="504">· 나무·위치에 따라 가격 차이가 큼</text>
</g>
</svg>
