<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="남색 밤하늘 아래 화장장 건물과 달력의 회차 칸, 국화 한 송이가 놓인 화장 예약 안내 그림">
<style>
  .t{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  @keyframes glow{0%,100%{opacity:.08}50%{opacity:.2}}
  @keyframes pick{0%,40%{opacity:0}55%,100%{opacity:1}}
  @keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
  @keyframes twinkle{0%,100%{opacity:.25}50%{opacity:.9}}
  .halo{animation:glow 6s ease-in-out infinite}
  .pick{animation:pick 6s ease-in-out infinite alternate}
  .flower{transform-origin:1080px 600px;animation:sway 8s ease-in-out infinite}
  .star{animation:twinkle 5s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1736"/><stop offset="1" stop-color="#2b2659"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle class="star" cx="620" cy="60" r="3" fill="#fff"/><circle class="star" cx="760" cy="40" r="2" fill="#fff" style="animation-delay:1.5s"/><circle class="star" cx="1120" cy="70" r="3" fill="#fff" style="animation-delay:3s"/>
<text x="70" y="100" class="t" font-size="28" font-weight="700" fill="#fcd34d">e하늘 장사정보시스템</text>
<text x="70" y="172" class="t" font-size="60" font-weight="900" fill="#ffffff">화장 예약 방법 5단계</text>
<text x="70" y="226" class="t" font-size="27" fill="#cbd5e1">사망진단서 · 관내 확인 · 회차 선택 · 마감 대처</text>
<!-- calendar -->
<g transform="translate(70 290)">
  <rect width="430" height="290" rx="18" fill="#1e2550" stroke="#3b4285" stroke-width="2"/>
  <rect width="430" height="58" rx="18" fill="#3b4285"/>
  <rect y="40" width="430" height="18" fill="#3b4285"/>
  <text x="24" y="38" class="t" font-size="24" font-weight="700" fill="#fff">3일차 화장 회차</text>
  <g class="t" font-size="20">
    <rect x="24" y="80" width="182" height="54" rx="10" fill="#334155"/><text x="40" y="114" fill="#94a3b8">1회차  예약완료</text>
    <rect x="224" y="80" width="182" height="54" rx="10" fill="#334155"/><text x="240" y="114" fill="#94a3b8">2회차  예약완료</text>
    <rect x="24" y="150" width="182" height="54" rx="10" fill="#1d4f4a"/><text x="40" y="184" fill="#a7f3d0">3회차  예약가능</text>
    <rect x="224" y="150" width="182" height="54" rx="10" fill="#334155"/><text x="240" y="184" fill="#cbd5e1">4회차  취소후대기</text>
    <rect class="pick" x="20" y="146" width="190" height="62" rx="12" fill="none" stroke="#fcd34d" stroke-width="4"/>
    <text x="24" y="250" fill="#e2e8f0">오전 이른 회차부터 먼저 찹니다</text>
  </g>
</g>
<!-- crematorium -->
<g transform="translate(640 300)">
  <circle class="halo" cx="160" cy="120" r="150" fill="#fde68a" opacity=".35"/>
  <rect x="40" y="110" width="240" height="150" rx="8" fill="#e9e3d3"/>
  <polygon points="20,116 160,30 300,116" fill="#c7bfa8"/>
  <rect x="135" y="180" width="50" height="80" fill="#8b7f66"/>
  <rect x="70" y="150" width="40" height="34" fill="#b9b09a"/><rect x="210" y="150" width="40" height="34" fill="#b9b09a"/>
  <rect x="0" y="260" width="320" height="10" rx="5" fill="#475569"/>
</g>
<!-- chrysanthemum -->
<g class="flower">
  <path d="M1080 600 C1078 540 1086 500 1080 450" stroke="#4d7c5a" stroke-width="6" fill="none"/>
  <ellipse cx="1060" cy="530" rx="24" ry="9" fill="#4d7c5a" transform="rotate(-30 1060 530)"/>
  <g transform="translate(1080 430)" fill="#fef3c7">
    <ellipse rx="10" ry="34"/><ellipse rx="10" ry="34" transform="rotate(30)"/><ellipse rx="10" ry="34" transform="rotate(60)"/><ellipse rx="10" ry="34" transform="rotate(90)"/><ellipse rx="10" ry="34" transform="rotate(120)"/><ellipse rx="10" ry="34" transform="rotate(150)"/>
    <circle r="12" fill="#fcd34d"/>
  </g>
</g>
</svg>
