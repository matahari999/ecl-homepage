<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="화장 예약 5단계 흐름도">
<style>
  .t{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  @keyframes fill{0%{stroke-dashoffset:960}60%,100%{stroke-dashoffset:0}}
  @keyframes pop{0%,100%{stroke:#fcd34d}50%{stroke:#fff7d6}}
  .line{stroke-dasharray:960;animation:fill 8s ease-in-out infinite}
  .dot circle{animation:pop 4s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="560" rx="24" fill="#131a3a"/>
<text x="60" y="76" class="t" font-size="34" font-weight="900" fill="#fff">e하늘 화장 예약 5단계</text>
<text x="60" y="118" class="t" font-size="22" fill="#cbd5e1">임종 당일, 장례식장 안치 직후에 진행합니다</text>
<line x1="150" y1="220" x2="1050" y2="220" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
<line class="line" x1="150" y1="220" x2="1050" y2="220" stroke="#fcd34d" stroke-width="8" stroke-linecap="round"/>
<g class="t" text-anchor="middle">
  <g class="dot"><circle cx="150" cy="220" r="40" fill="#3b4285" stroke="#fcd34d" stroke-width="4"/><text x="150" y="232" font-size="32" font-weight="900" fill="#fff">1</text></g>
  <g class="dot" style="animation-delay:.8s"><circle cx="375" cy="220" r="40" fill="#3b4285" stroke="#fcd34d" stroke-width="4"/><text x="375" y="232" font-size="32" font-weight="900" fill="#fff">2</text></g>
  <g class="dot" style="animation-delay:1.6s"><circle cx="600" cy="220" r="40" fill="#3b4285" stroke="#fcd34d" stroke-width="4"/><text x="600" y="232" font-size="32" font-weight="900" fill="#fff">3</text></g>
  <g class="dot" style="animation-delay:2.4s"><circle cx="825" cy="220" r="40" fill="#3b4285" stroke="#fcd34d" stroke-width="4"/><text x="825" y="232" font-size="32" font-weight="900" fill="#fff">4</text></g>
  <g class="dot" style="animation-delay:3.2s"><circle cx="1050" cy="220" r="40" fill="#3b4285" stroke="#fcd34d" stroke-width="4"/><text x="1050" y="232" font-size="32" font-weight="900" fill="#fff">5</text></g>
  <g font-size="22" font-weight="700" fill="#fff">
    <text x="150" y="310">사망진단서</text><text x="150" y="340">확보</text>
    <text x="375" y="310">고인 주민등록</text><text x="375" y="340">주소 확인</text>
    <text x="600" y="310">화장장·날짜</text><text x="600" y="340">회차 선택</text>
    <text x="825" y="310">고인·신고인</text><text x="825" y="340">정보·서류 입력</text>
    <text x="1050" y="310">예약번호 확인</text><text x="1050" y="340">발인 시각 역산</text>
  </g>
  <g font-size="18" fill="#94a3b8">
    <text x="150" y="380">사본 여러 장</text>
    <text x="375" y="380">관내·관외 결정</text>
    <text x="600" y="380">이른 회차부터 마감</text>
    <text x="825" y="380">본인인증 필요</text>
    <text x="1050" y="380">가족에게 공유</text>
  </g>
</g>
<rect x="60" y="430" width="1080" height="84" rx="16" fill="#1e2550" stroke="#3b4285" stroke-width="2"/>
<text x="90" y="482" class="t" font-size="22" fill="#e2e8f0">화장은 원칙적으로 사망 후 24시간이 지나야 가능 · 화장료는 화장장에 직접 납부</text>
</svg>
