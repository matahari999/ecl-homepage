<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="발인부터 화장 접수 시 산골 신청, 약 2시간 화장, 유택동산 산골, 귀가까지 이어지는 셋째 날 흐름">
<style>
  .t{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  @keyframes pop{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
  @keyframes dash{to{stroke-dashoffset:-40}}
  .s{animation:pop .7s ease-out both}
  .s2{animation-delay:.5s}.s3{animation-delay:1s}.s4{animation-delay:1.5s}.s5{animation-delay:2s}
  .ln{stroke-dasharray:10 10;animation:dash 1.5s linear infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="900" height="520" rx="18" fill="#f6f8f6"/>
<text x="40" y="58" class="t" font-size="28" font-weight="900" fill="#1f3a2c">셋째 날: 발인에서 산골까지</text>
<text x="40" y="92" class="t" font-size="17" fill="#5b6b62">서울시립승화원 유택동산 이용 기준 (서울시설공단 안내)</text>
<line class="ln" x1="110" y1="190" x2="790" y2="190" stroke="#7ea57a" stroke-width="4"/>
<g class="t" text-anchor="middle">
  <g class="s"><circle cx="110" cy="190" r="34" fill="#1f3a2c"/><text x="110" y="198" font-size="20" font-weight="800" fill="#fff">1</text>
    <text x="110" y="256" font-size="19" font-weight="800" fill="#1f3a2c">발인</text><text x="110" y="282" font-size="15" fill="#5b6b62">장례식장 출발</text></g>
  <g class="s s2"><circle cx="280" cy="190" r="34" fill="#1f3a2c"/><text x="280" y="198" font-size="20" font-weight="800" fill="#fff">2</text>
    <text x="280" y="256" font-size="19" font-weight="800" fill="#1f3a2c">화장 접수</text><text x="280" y="282" font-size="15" fill="#5b6b62">이때 산골 신청</text></g>
  <g class="s s3"><circle cx="450" cy="190" r="34" fill="#1f3a2c"/><text x="450" y="198" font-size="20" font-weight="800" fill="#fff">3</text>
    <text x="450" y="256" font-size="19" font-weight="800" fill="#1f3a2c">화장</text><text x="450" y="282" font-size="15" fill="#5b6b62">약 2시간</text></g>
  <g class="s s4"><circle cx="620" cy="190" r="34" fill="#5f8f62"/><text x="620" y="198" font-size="20" font-weight="800" fill="#fff">4</text>
    <text x="620" y="256" font-size="19" font-weight="800" fill="#1f3a2c">유택동산 산골</text><text x="620" y="282" font-size="15" fill="#5b6b62">유족이 직접</text></g>
  <g class="s s5"><circle cx="790" cy="190" r="34" fill="#5f8f62"/><text x="790" y="198" font-size="20" font-weight="800" fill="#fff">5</text>
    <text x="790" y="256" font-size="19" font-weight="800" fill="#1f3a2c">귀가</text><text x="790" y="282" font-size="15" fill="#5b6b62">장례 마무리</text></g>
</g>
<g class="t s s5">
  <rect x="40" y="330" width="820" height="150" rx="14" fill="#fff" stroke="#d6dfd8"/>
  <text x="66" y="370" font-size="18" font-weight="800" fill="#1f3a2c">알아둘 점</text>
  <text x="66" y="404" font-size="16" fill="#3d4d44">· 유택동산 이용료: 무료 · 산골 뒤에는 따로 모실 유골함이 남지 않습니다</text>
  <text x="66" y="434" font-size="16" fill="#3d4d44">· 다른 화장장에서 화장했다면 화장증명서 1부 필요 (서울·고양·파주 시민)</text>
  <text x="66" y="464" font-size="16" fill="#3d4d44">· 뿌린 유회는 공단 직원이 용미리 제1묘지 추모의 숲에 월 2회 안장</text>
</g>
</svg>
