<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="국화와 촛불, 두 병원을 잇는 길 위의 이송 차량으로 표현한 장례식장 이동 그림">
<style>
  .t{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  @keyframes flick{0%,100%{transform:scale(1,1)}30%{transform:scale(.9,1.08)}60%{transform:scale(1.05,.95)}}
  @keyframes glow{0%,100%{opacity:.35}50%{opacity:.8}}
  @keyframes drive{0%{transform:translateX(0)}100%{transform:translateX(330px)}}
  @keyframes dash{to{stroke-dashoffset:-80}}
  @keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
  .fl{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.6s ease-in-out infinite}
  .gl{animation:glow 3.4s ease-in-out infinite}
  .car{animation:drive 6s ease-in-out infinite alternate}
  .rd{animation:dash 2.5s linear infinite}
  .ch{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121c3a"/><stop offset="1" stop-color="#2a2f52"/></linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#fcd34d" stop-opacity=".85"/><stop offset="1" stop-color="#fcd34d" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<!-- 건물 두 채 -->
<g opacity=".9">
  <rect x="660" y="250" width="150" height="230" rx="6" fill="#b9c7d6"/>
  <rect x="1000" y="210" width="170" height="270" rx="6" fill="#a7b8ca"/>
  <g fill="#eef3f8"><rect x="680" y="275" width="30" height="26"/><rect x="725" y="275" width="30" height="26"/><rect x="770" y="275" width="26" height="26"/><rect x="680" y="320" width="30" height="26"/><rect x="725" y="320" width="30" height="26"/><rect x="770" y="320" width="26" height="26"/>
  <rect x="1020" y="235" width="34" height="28"/><rect x="1068" y="235" width="34" height="28"/><rect x="1116" y="235" width="34" height="28"/><rect x="1020" y="285" width="34" height="28"/><rect x="1068" y="285" width="34" height="28"/><rect x="1116" y="285" width="34" height="28"/><rect x="1020" y="335" width="34" height="28"/><rect x="1068" y="335" width="34" height="28"/><rect x="1116" y="335" width="34" height="28"/></g>
</g>
<!-- 길 -->
<rect x="620" y="480" width="580" height="46" fill="#8a96a8"/>
<line class="rd" x1="620" y1="503" x2="1200" y2="503" stroke="#fff" stroke-width="4" stroke-dasharray="24 16"/>
<g class="car"><g transform="translate(660 452)"><rect x="0" y="0" width="120" height="44" rx="10" fill="#fff" stroke="#475569" stroke-width="3"/><rect x="82" y="8" width="28" height="18" rx="4" fill="#bfdbfe"/><rect x="40" y="14" width="22" height="6" fill="#64748b"/><rect x="48" y="6" width="6" height="22" fill="#64748b"/><circle cx="26" cy="46" r="11" fill="#334155"/><circle cx="96" cy="46" r="11" fill="#334155"/></g></g>
<!-- 국화와 초 -->
<g transform="translate(700 628)"><g class="ch">
  <path d="M0 0 C -6 -40, -4 -80, 0 -120" stroke="#4d7c0f" stroke-width="5" fill="none"/>
  <g fill="#fff7e0" stroke="#e5c97a" stroke-width="1.2"><ellipse cx="0" cy="-138" rx="10" ry="26"/><ellipse cx="0" cy="-138" rx="10" ry="26" transform="rotate(45 0 -138)"/><ellipse cx="0" cy="-138" rx="10" ry="26" transform="rotate(90 0 -138)"/><ellipse cx="0" cy="-138" rx="10" ry="26" transform="rotate(135 0 -138)"/></g>
  <circle cx="0" cy="-138" r="8" fill="#facc15"/>
</g></g>
<g transform="translate(790 628)"><g class="ch">
  <path d="M0 0 C 6 -40, 4 -70, 0 -100" stroke="#4d7c0f" stroke-width="5" fill="none"/>
  <g fill="#ffffff" stroke="#d6d3d1" stroke-width="1.2"><ellipse cx="0" cy="-116" rx="9" ry="22"/><ellipse cx="0" cy="-116" rx="9" ry="22" transform="rotate(45 0 -116)"/><ellipse cx="0" cy="-116" rx="9" ry="22" transform="rotate(90 0 -116)"/><ellipse cx="0" cy="-116" rx="9" ry="22" transform="rotate(135 0 -116)"/></g>
  <circle cx="0" cy="-116" r="7" fill="#fde68a"/>
</g></g>
<circle class="gl" cx="1100" cy="560" r="80" fill="url(#halo)"/>
<rect x="1084" y="565" width="32" height="60" rx="5" fill="#fffdf7" stroke="#e7e5e4"/>
<path class="fl" d="M1100 527 C 1112 543, 1111 557, 1100 563 C 1089 557, 1088 543, 1100 527 Z" fill="#f59e0b"/>
<!-- 제목 -->
<text class="t" x="70" y="180" font-size="26" fill="#93c5fd" font-weight="700">병원 간 이송 · 3일장</text>
<text class="t" x="70" y="262" font-size="62" fill="#ffffff" font-weight="800">이대목동병원</text>
<text class="t" x="70" y="338" font-size="62" fill="#ffffff" font-weight="800">장례식장</text>
<text class="t" x="70" y="396" font-size="26" fill="#cbd5e1">임종한 병원에서 가족 곁으로 · 실제 진행 사례</text>
<text class="t" x="70" y="570" font-size="22" fill="#94a3b8">이음케어라이프 후불제 상조</text>
</svg>
