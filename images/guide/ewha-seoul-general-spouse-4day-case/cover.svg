<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="밤하늘 아래 흰 국화와 촛불, 하루가 더해진 4일 달력으로 표현한 무종교 4일장 그림">
<style>
  .t{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
  @keyframes flick{0%,100%{transform:scale(1,1)}30%{transform:scale(.9,1.08)}60%{transform:scale(1.05,.95)}}
  @keyframes glow{0%,100%{opacity:.4}50%{opacity:.8}}
  @keyframes pop{0%,20%{opacity:0;transform:translateY(12px)}45%,100%{opacity:1;transform:translateY(0)}}
  @keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
  .s1{animation:tw 2.6s ease-in-out infinite}.s2{animation:tw 3.4s ease-in-out .8s infinite}.s3{animation:tw 4.2s ease-in-out 1.6s infinite}
  .fl{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.6s ease-in-out infinite}
  .gl{animation:glow 3.2s ease-in-out infinite}
  .d4{animation:pop 2.4s ease-out both}
  .ch{transform-origin:930px 560px;animation:sway 7s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14112e"/><stop offset="1" stop-color="#2b2a52"/></linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#fcd34d" stop-opacity=".8"/><stop offset="1" stop-color="#fcd34d" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<g fill="#fef9c3">
  <circle class="s1" cx="640" cy="60" r="3"/><circle class="s2" cx="760" cy="120" r="2.5"/><circle class="s3" cx="560" cy="300" r="2"/>
  <circle class="s2" cx="1130" cy="80" r="3"/><circle class="s1" cx="930" cy="50" r="2"/><circle class="s3" cx="1100" cy="250" r="2.5"/>
  <circle class="s1" cx="480" cy="290" r="2"/><circle class="s3" cx="850" cy="210" r="2"/>
</g>
<circle cx="1040" cy="140" r="50" fill="#fef3c7"/><circle cx="1062" cy="124" r="46" fill="#17142f"/>
<rect x="0" y="565" width="1200" height="65" fill="#100e24"/>
<!-- 달력 4칸 -->
<g class="t" font-weight="800">
  <g fill="#2f2c5c" stroke="#5b57a0" stroke-width="2">
    <rect x="70" y="330" width="96" height="110" rx="12"/><rect x="180" y="330" width="96" height="110" rx="12"/><rect x="290" y="330" width="96" height="110" rx="12"/>
  </g>
  <rect class="d4" x="400" y="330" width="96" height="110" rx="12" fill="#fcd34d"/>
  <g font-size="22" fill="#e2e8f0" text-anchor="middle"><text x="118" y="378">1일</text><text x="228" y="378">2일</text><text x="338" y="378">3일</text></g>
  <text class="d4" x="448" y="378" font-size="22" fill="#1e1b4b" text-anchor="middle">4일</text>
  <g font-size="15" fill="#a5b4fc" text-anchor="middle" font-weight="600"><text x="118" y="414">안치</text><text x="228" y="414">조문</text><text x="338" y="414">입관</text></g>
  <text class="d4" x="448" y="414" font-size="15" fill="#1e1b4b" text-anchor="middle">발인·화장</text>
  <text x="70" y="480" font-size="18" fill="#cbd5e1" font-weight="600">화장 예약이 밀려 하루를 더한 일정</text>
</g>
<!-- 촛불 -->
<circle class="gl" cx="720" cy="400" r="140" fill="url(#halo)"/>
<rect x="694" y="430" width="52" height="135" rx="8" fill="#fffdf7"/>
<line x1="720" y1="430" x2="720" y2="414" stroke="#57534e" stroke-width="3"/>
<path class="fl" d="M720 356 C 740 384, 738 404, 720 416 C 702 404, 700 384, 720 356 Z" fill="#f59e0b"/>
<path class="fl" d="M720 380 C 729 393, 728 404, 720 410 C 712 404, 711 393, 720 380 Z" fill="#fff7d6"/>
<!-- 국화 -->
<g class="ch">
  <path d="M930 565 C 925 500, 945 460, 930 410" stroke="#4d7c0f" stroke-width="7" fill="none"/>
  <path d="M934 500 C 970 480, 1000 486, 1018 500 C 988 516, 958 516, 934 500 Z" fill="#65a30d"/>
  <g transform="translate(930 400)" fill="#ffffff" stroke="#e2e8f0" stroke-width="1">
    <ellipse rx="10" ry="40" transform="rotate(0)"/><ellipse rx="10" ry="40" transform="rotate(30)"/><ellipse rx="10" ry="40" transform="rotate(60)"/>
    <ellipse rx="10" ry="40" transform="rotate(90)"/><ellipse rx="10" ry="40" transform="rotate(120)"/><ellipse rx="10" ry="40" transform="rotate(150)"/>
    <ellipse rx="8" ry="28" transform="rotate(15)"/><ellipse rx="8" ry="28" transform="rotate(75)"/><ellipse rx="8" ry="28" transform="rotate(135)"/>
    <circle r="14" fill="#fde68a" stroke="none"/>
  </g>
  <g transform="translate(1040 470)" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1">
    <ellipse rx="7" ry="28"/><ellipse rx="7" ry="28" transform="rotate(36)"/><ellipse rx="7" ry="28" transform="rotate(72)"/><ellipse rx="7" ry="28" transform="rotate(108)"/><ellipse rx="7" ry="28" transform="rotate(144)"/>
    <circle r="10" fill="#fde68a" stroke="none"/>
  </g>
  <path d="M1040 565 C 1036 530, 1044 505, 1040 495" stroke="#4d7c0f" stroke-width="6" fill="none"/>
</g>
<text x="70" y="130" class="t" font-size="52" font-weight="900" fill="#ffffff">이대서울병원장례식장</text>
<text x="70" y="198" class="t" font-size="40" font-weight="900" fill="#fcd34d">무종교 배우자상 4일장</text>
<text x="70" y="250" class="t" font-size="24" font-weight="700" fill="#cbd5e1">화장 예약 대기 · 실제 진행 사례</text>
</svg>
