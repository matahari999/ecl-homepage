<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-label="화장 예약이 밀렸을 때 4일장으로 기다리는 방법과 다른 지역 화장시설을 찾는 방법을 비교한 그림">
<style>
  .t{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  @keyframes in{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
  @keyframes dash{to{stroke-dashoffset:-24}}
  .a{animation:in .8s ease-out both}.b{animation:in .8s ease-out .5s both}.c{animation:in .8s ease-out 1s both}.d{animation:in .8s ease-out 1.5s both}
  .ln{stroke-dasharray:8 8;animation:dash 1.2s linear infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1000" height="620" rx="24" fill="#1e1b4b"/>
<g class="t">
  <text x="500" y="58" text-anchor="middle" font-size="28" font-weight="900" fill="#ffffff">화장 예약이 밀렸을 때, 두 가지 길</text>
  <g class="a">
    <rect x="300" y="88" width="400" height="84" rx="16" fill="#ffffff"/>
    <text x="500" y="124" text-anchor="middle" font-size="21" font-weight="800" fill="#1e1b4b">원하는 날 관내 화장장 예약 마감</text>
    <text x="500" y="154" text-anchor="middle" font-size="16" fill="#475569">e하늘에서 다른 날짜·다른 시설 조회</text>
  </g>
  <path class="ln" d="M420 172 L250 236 M580 172 L750 236" stroke="#a5b4fc" stroke-width="3" fill="none"/>
  <g class="b">
    <rect x="40" y="236" width="420" height="270" rx="18" fill="#ffffff"/>
    <rect x="40" y="236" width="420" height="56" rx="18" fill="#fcd34d"/><rect x="40" y="270" width="420" height="22" fill="#fcd34d"/>
    <text x="250" y="273" text-anchor="middle" font-size="22" font-weight="900" fill="#1e1b4b">① 하루 기다려 4일장</text>
    <g font-size="17" fill="#1f2937">
      <text x="66" y="330">· 화장 요금은 관내 기준 유지</text>
      <text x="66" y="364">· 빈소·안치 하루치 비용 추가</text>
      <text x="66" y="398">· 조문 기간이 늘어 여유 있게 인사</text>
      <text x="66" y="432">· 가족 체력 배분이 중요</text>
    </g>
    <text x="66" y="482" font-size="16" font-weight="800" fill="#7c3aed">일정을 서두르지 않아도 될 때</text>
  </g>
  <g class="c">
    <rect x="540" y="236" width="420" height="270" rx="18" fill="#ffffff"/>
    <rect x="540" y="236" width="420" height="56" rx="18" fill="#c7d2fe"/><rect x="540" y="270" width="420" height="22" fill="#c7d2fe"/>
    <text x="750" y="273" text-anchor="middle" font-size="22" font-weight="900" fill="#1e1b4b">② 다른 지역 화장시설</text>
    <g font-size="17" fill="#1f2937">
      <text x="566" y="330">· 3일장 일정을 지킬 수 있음</text>
      <text x="566" y="364">· 관외 요금이 적용돼 화장비 증가</text>
      <text x="566" y="398">· 이동 거리·시간이 늘어남</text>
      <text x="566" y="432">· 장지와 가까운 곳이면 유리</text>
    </g>
    <text x="566" y="482" font-size="16" font-weight="800" fill="#475569">금액은 시설별 요금표로 비교</text>
  </g>
  <g class="d">
    <text x="500" y="560" text-anchor="middle" font-size="18" font-weight="700" fill="#e0e7ff">하루치 장례식장 비용 vs 관외 화장 요금 + 이동 부담을 함께 놓고 결정</text>
    <text x="500" y="592" text-anchor="middle" font-size="15" fill="#a5b4fc">화장은 사망 후 24시간이 지나야 가능합니다 (장사법 제6조)</text>
  </g>
</g>
</svg>
