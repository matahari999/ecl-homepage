<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="어두운 남색 배경에 작은 빈소 제단과 촛불, 흰 국화를 그리고 가족장 작은 장례 절차 제목을 넣은 일러스트">
<style>
  .t{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  @keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.9,1.1)}}
  @keyframes halo{0%,100%{opacity:.3}50%{opacity:.6}}
  @keyframes star{0%,100%{opacity:.2}50%{opacity:.9}}
  @keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .f1{transform-origin:860px 300px;animation:flick 2.8s ease-in-out infinite}
  .f2{transform-origin:1060px 300px;animation:flick 3.2s ease-in-out infinite}
  .halo{animation:halo 5s ease-in-out infinite}
  .s{animation:star 6s ease-in-out infinite}.s2{animation-delay:2s}.s3{animation-delay:4s}
  .chip{animation:rise 7s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e1533"/><stop offset="1" stop-color="#2b2457"/></linearGradient><radialGradient id="hg"><stop offset="0" stop-color="#fde68a" stop-opacity=".9"/><stop offset="1" stop-color="#fde68a" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<g fill="#e2e8f0"><circle class="s" cx="620" cy="60" r="2.5"/><circle class="s s2" cx="740" cy="120" r="2"/><circle class="s s3" cx="1130" cy="70" r="2.5"/><circle class="s s2" cx="980" cy="45" r="2"/></g>
<text x="70" y="110" class="t" font-size="28" font-weight="700" fill="#fcd34d">가족·가까운 분만 모시는 장례</text>
<text x="70" y="192" class="t" font-size="64" font-weight="900" fill="#ffffff">가족장 작은 장례 절차</text>
<text x="70" y="250" class="t" font-size="28" fill="#cbd5e1">부고 범위부터 발인까지 6단계</text>
<g class="t chip">
  <rect x="70" y="320" width="150" height="56" rx="28" fill="#1b2350" stroke="#5b63b0" stroke-width="2"/><text x="145" y="357" font-size="24" fill="#e2e8f0" text-anchor="middle">부고 범위</text>
  <rect x="236" y="320" width="150" height="56" rx="28" fill="#1b2350" stroke="#5b63b0" stroke-width="2"/><text x="311" y="357" font-size="24" fill="#e2e8f0" text-anchor="middle">작은 빈소</text>
  <rect x="402" y="320" width="150" height="56" rx="28" fill="#1b2350" stroke="#5b63b0" stroke-width="2"/><text x="477" y="357" font-size="24" fill="#e2e8f0" text-anchor="middle">조의금</text>
  <rect x="70" y="396" width="150" height="56" rx="28" fill="#1b2350" stroke="#5b63b0" stroke-width="2"/><text x="145" y="433" font-size="24" fill="#e2e8f0" text-anchor="middle">입관</text>
  <rect x="236" y="396" width="150" height="56" rx="28" fill="#1b2350" stroke="#5b63b0" stroke-width="2"/><text x="311" y="433" font-size="24" fill="#e2e8f0" text-anchor="middle">발인·화장</text>
  <rect x="402" y="396" width="150" height="56" rx="28" fill="#1b2350" stroke="#5b63b0" stroke-width="2"/><text x="477" y="433" font-size="24" fill="#e2e8f0" text-anchor="middle">장지</text>
</g>
<text x="70" y="540" class="t" font-size="24" fill="#a5b4fc">2일장·3일장 모두 가능 · 사망 후 24시간 지나 화장</text>
<!-- altar -->
<rect x="760" y="420" width="380" height="150" rx="10" fill="#3b3470"/>
<rect x="740" y="400" width="420" height="30" rx="8" fill="#4a4288"/>
<rect x="900" y="250" width="120" height="150" rx="8" fill="#1f2547" stroke="#f5e6c8" stroke-width="4"/>
<rect x="920" y="270" width="80" height="110" rx="4" fill="#2d3566"/>
<path d="M930 290h60M930 310h60" stroke="#f5e6c8" stroke-width="2" opacity=".5"/>
<circle class="halo" cx="860" cy="300" r="60" fill="url(#hg)"/><circle class="halo" cx="1060" cy="300" r="60" fill="url(#hg)"/>
<rect x="848" y="320" width="24" height="80" rx="4" fill="#f5e6c8"/><rect x="1048" y="320" width="24" height="80" rx="4" fill="#f5e6c8"/>
<path class="f1" d="M860 280c10 14 12 26 0 38c-12-12-10-24 0-38z" fill="#fcd34d"/>
<path class="f2" d="M1060 280c10 14 12 26 0 38c-12-12-10-24 0-38z" fill="#fcd34d"/>
<g fill="#ffffff"><circle cx="800" cy="390" r="14"/><circle cx="822" cy="384" r="12"/><circle cx="1100" cy="390" r="14"/><circle cx="1122" cy="384" r="12"/><circle cx="940" cy="412" r="9"/><circle cx="980" cy="412" r="9"/></g>
<g fill="#fcd34d"><circle cx="800" cy="390" r="5"/><circle cx="1100" cy="390" r="5"/></g>
</svg>
