<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="밤하늘 아래 촛불과 흰 국화, 마주 잡은 두 손을 그린 이별 준비 그림">
<style>
  .t{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  @keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.92,1.08)}}
  @keyframes glow{0%,100%{opacity:.35}50%{opacity:.6}}
  @keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
  @keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:.8}100%{transform:translateY(-160px);opacity:0}}
  .fl{transform-origin:930px 300px;animation:flick 1.6s ease-in-out infinite}
  .gl{animation:glow 3s ease-in-out infinite}
  .s1{animation:tw 3s infinite}.s2{animation:tw 4s 1s infinite}.s3{animation:tw 5s 2s infinite}
  .p1{animation:rise 6s ease-out infinite}.p2{animation:rise 6s ease-out 2s infinite}.p3{animation:rise 6s ease-out 4s infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1430"/><stop offset="1" stop-color="#2a2350"/></linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#ffd27a" stop-opacity=".8"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<g fill="#fff"><circle class="s1" cx="120" cy="60" r="2.5"/><circle class="s2" cx="300" cy="40" r="2"/><circle class="s3" cx="560" cy="70" r="2.5"/><circle class="s1" cx="760" cy="40" r="2"/><circle class="s2" cx="1100" cy="70" r="3"/><circle class="s3" cx="1010" cy="140" r="2"/></g>
<circle cx="1080" cy="130" r="46" fill="#f5ecc8" opacity=".9"/><circle cx="1100" cy="118" r="44" fill="#141b3a"/>
<!-- table -->
<rect x="700" y="470" width="460" height="22" rx="8" fill="#43386e"/>
<!-- candle -->
<circle class="gl" cx="930" cy="300" r="140" fill="url(#halo)"/>
<rect x="905" y="330" width="50" height="140" rx="8" fill="#f8f1e3"/>
<ellipse cx="930" cy="330" rx="25" ry="7" fill="#e9dfc9"/>
<line x1="930" y1="330" x2="930" y2="314" stroke="#333" stroke-width="3"/>
<path class="fl" d="M930 255 C950 285 948 310 930 316 C912 310 910 285 930 255Z" fill="#ffb84d"/>
<g fill="#ffe7a8"><circle class="p1" cx="915" cy="250" r="3"/><circle class="p2" cx="945" cy="260" r="2.5"/><circle class="p3" cx="930" cy="245" r="2"/></g>
<!-- chrysanthemums -->
<g transform="translate(1050 430)">
  <path d="M0 40 L0 -10" stroke="#5f9c6a" stroke-width="5"/>
  <g fill="#fff">
    <ellipse rx="10" ry="28" transform="rotate(0)"/><ellipse rx="10" ry="28" transform="rotate(30)"/><ellipse rx="10" ry="28" transform="rotate(60)"/><ellipse rx="10" ry="28" transform="rotate(90)"/><ellipse rx="10" ry="28" transform="rotate(120)"/><ellipse rx="10" ry="28" transform="rotate(150)"/>
  </g><circle r="10" fill="#f4d35e"/>
</g>
<g transform="translate(800 440) scale(.75)">
  <g fill="#f3f0ff">
    <ellipse rx="10" ry="28"/><ellipse rx="10" ry="28" transform="rotate(30)"/><ellipse rx="10" ry="28" transform="rotate(60)"/><ellipse rx="10" ry="28" transform="rotate(90)"/><ellipse rx="10" ry="28" transform="rotate(120)"/><ellipse rx="10" ry="28" transform="rotate(150)"/>
  </g><circle r="10" fill="#f4d35e"/>
</g>
<!-- two hands holding -->
<g transform="translate(900 478)">
  <path d="M-130 70 C-110 30 -60 10 -10 18 L40 26 C55 28 55 46 40 48 L0 50 Z" fill="#e9c6a8"/>
  <path d="M190 70 C170 34 120 12 70 20 L20 30 C6 34 8 50 22 50 L60 52 Z" fill="#d9ad8b"/>
  <rect x="-170" y="62" width="70" height="40" rx="10" fill="#6c5fa8"/><rect x="160" y="62" width="70" height="40" rx="10" fill="#8a7cc4"/>
</g>
<!-- titles -->
<text x="70" y="250" class="t" font-size="58" font-weight="900" fill="#ffffff">사랑하는 사람을</text>
<text x="70" y="328" class="t" font-size="58" font-weight="900" fill="#ffffff">보내는 마음가짐</text>
<rect x="70" y="372" width="420" height="56" rx="28" fill="#ffd27a"/>
<text x="280" y="410" text-anchor="middle" class="t" font-size="28" font-weight="800" fill="#1d1640">임종 전 · 장례 중 · 장례 후</text>
<text x="70" y="490" class="t" font-size="26" font-weight="500" fill="#cfd3f5">장례지도사가 정리한 이별 준비 안내</text>
</svg>
