<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="남색 밤하늘 아래 국화와 촛불, 세 칸으로 나뉜 비용 막대로 표현한 3일장 장례비용 평균 안내 그림">
<style>
  .t{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  @keyframes flick{0%,100%{transform:scale(1,1)}30%{transform:scale(.92,1.07)}60%{transform:scale(1.04,.96)}}
  @keyframes glow{0%,100%{opacity:.35}50%{opacity:.8}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
  .fl{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.8s ease-in-out infinite}
  .gl{animation:glow 3.6s ease-in-out infinite}
  .bar{transform-box:fill-box;transform-origin:0 50%;animation:grow 2.4s ease-out both}
  .b2{animation-delay:.6s}.b3{animation-delay:1.2s}
  .st{animation:tw 3.2s ease-in-out infinite}.s2{animation-delay:1.3s}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1230"/><stop offset="1" stop-color="#2a2260"/></linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#fcd34d" stop-opacity=".85"/><stop offset="1" stop-color="#fcd34d" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<g fill="#fff"><circle class="st" cx="640" cy="50" r="2.5"/><circle class="st s2" cx="1120" cy="80" r="2.5"/><circle class="st" cx="900" cy="36" r="2"/><circle class="st s2" cx="1010" cy="140" r="2"/><circle class="st" cx="760" cy="120" r="1.8"/></g>

<!-- title -->
<text class="t" x="80" y="150" fill="#fde68a" font-size="30" font-weight="700">장례·요양 가이드</text>
<text class="t" x="80" y="230" fill="#ffffff" font-size="64" font-weight="800">장례비용 평균, 3일장은</text>
<text class="t" x="80" y="310" fill="#ffffff" font-size="64" font-weight="800">얼마로 잡아야 할까</text>

<!-- cost bar -->
<text class="t" x="80" y="400" fill="#c7d2fe" font-size="26">3일장 비용은 세 덩어리로 나뉩니다</text>
<g>
  <rect class="bar" x="80" y="425" width="170" height="54" rx="10" fill="#818cf8"/>
  <rect class="bar b2" x="258" y="425" width="300" height="54" rx="10" fill="#f9a8d4"/>
  <rect class="bar b3" x="566" y="425" width="120" height="54" rx="10" fill="#fcd34d"/>
</g>
<text class="t" x="165" y="520" fill="#e0e7ff" font-size="24" text-anchor="middle">상조</text>
<text class="t" x="408" y="520" fill="#e0e7ff" font-size="24" text-anchor="middle">장례식장</text>
<text class="t" x="626" y="520" fill="#e0e7ff" font-size="24" text-anchor="middle">화장·장지</text>

<!-- candle + chrysanthemum -->
<circle class="gl" cx="960" cy="330" r="150" fill="url(#halo)"/>
<rect x="930" y="360" width="60" height="150" rx="8" fill="#fef3c7"/>
<rect x="958" y="342" width="4" height="20" fill="#78350f"/>
<path class="fl" d="M960 280 C978 305 980 326 960 344 C940 326 942 305 960 280Z" fill="#fbbf24"/>
<rect x="890" y="508" width="140" height="16" rx="6" fill="#a5b4fc"/>
<g transform="translate(1085 470)">
  <path d="M0 60 C-4 20 4 -10 0 -40" stroke="#4ade80" stroke-width="5" fill="none"/>
  <g fill="#fffbeb">
    <ellipse cx="0" cy="-58" rx="10" ry="26"/><ellipse cx="0" cy="-58" rx="10" ry="26" transform="rotate(45 0 -58)"/>
    <ellipse cx="0" cy="-58" rx="10" ry="26" transform="rotate(90 0 -58)"/><ellipse cx="0" cy="-58" rx="10" ry="26" transform="rotate(135 0 -58)"/>
  </g>
  <circle cx="0" cy="-58" r="9" fill="#fde68a"/>
</g>
<g transform="translate(845 485)">
  <path d="M0 45 C3 15 -3 -5 0 -30" stroke="#4ade80" stroke-width="4" fill="none"/>
  <g fill="#fffbeb">
    <ellipse cx="0" cy="-44" rx="8" ry="20"/><ellipse cx="0" cy="-44" rx="8" ry="20" transform="rotate(60 0 -44)"/><ellipse cx="0" cy="-44" rx="8" ry="20" transform="rotate(120 0 -44)"/>
  </g>
  <circle cx="0" cy="-44" r="7" fill="#fde68a"/>
</g>
<text class="t" x="80" y="590" fill="#a5b4fc" font-size="22">ecl.ai.kr/guide</text>
</svg>
