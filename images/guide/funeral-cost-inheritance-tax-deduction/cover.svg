<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="장례 영수증과 계산기, 국화 한 송이를 그린 장례비용 상속세 공제 안내 그림">
<style>
  .t{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  @keyframes rise{0%{transform:translateY(14px);opacity:0}100%{transform:translateY(0);opacity:1}}
  @keyframes glow{0%,100%{opacity:.35}50%{opacity:.7}}
  @keyframes stamp{0%,40%{transform:scale(1.6);opacity:0}55%{transform:scale(.95);opacity:1}65%,100%{transform:scale(1);opacity:1}}
  .r1{animation:rise 1s ease-out .2s both}.r2{animation:rise 1s ease-out .6s both}.r3{animation:rise 1s ease-out 1s both}
  .g{animation:glow 5s ease-in-out infinite}
  .s{transform-origin:1010px 420px;animation:stamp 2.4s ease-out 1s both}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101a3a"/><stop offset="1" stop-color="#26204a"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle class="g" cx="930" cy="300" r="260" fill="#3b3a7a"/>
<!-- receipts -->
<g transform="rotate(-6 900 330)">
  <path d="M780 130 h220 v340 l-18 -12 -18 12 -18 -12 -18 12 -18 -12 -18 12 -18 -12 -18 12 -18 -12 -18 12 -18 -12 -18 12z" fill="#f8fafc"/>
  <rect x="805" y="160" width="120" height="14" rx="7" fill="#94a3b8"/>
  <g fill="#cbd5e1"><rect x="805" y="200" width="170" height="10" rx="5"/><rect x="805" y="228" width="150" height="10" rx="5"/><rect x="805" y="256" width="170" height="10" rx="5"/><rect x="805" y="284" width="130" height="10" rx="5"/><rect x="805" y="312" width="160" height="10" rx="5"/></g>
  <rect x="805" y="360" width="170" height="3" fill="#64748b"/>
  <rect x="885" y="378" width="90" height="16" rx="8" fill="#475569"/>
</g>
<!-- calculator -->
<g class="r2">
  <rect x="640" y="300" width="160" height="230" rx="18" fill="#334155"/>
  <rect x="660" y="320" width="120" height="50" rx="8" fill="#a7f3d0"/>
  <g fill="#e2e8f0"><rect x="660" y="390" width="32" height="28" rx="6"/><rect x="704" y="390" width="32" height="28" rx="6"/><rect x="748" y="390" width="32" height="28" rx="6"/><rect x="660" y="430" width="32" height="28" rx="6"/><rect x="704" y="430" width="32" height="28" rx="6"/><rect x="660" y="470" width="32" height="28" rx="6"/><rect x="704" y="470" width="32" height="28" rx="6"/></g>
  <rect x="748" y="430" width="32" height="68" rx="6" fill="#fbbf24"/>
</g>
<!-- stamp -->
<g class="s"><circle cx="1010" cy="420" r="62" fill="none" stroke="#f87171" stroke-width="7"/><text x="1010" y="432" text-anchor="middle" class="t" font-size="34" font-weight="900" fill="#f87171">공제</text></g>
<!-- chrysanthemum -->
<g class="r3"><g transform="translate(1110 600)">
  <path d="M0 0 C-10 -60 -6 -110 -20 -150" stroke="#4ade80" stroke-width="6" fill="none"/>
  <g transform="translate(-20 -165)" fill="#fefce8">
    <ellipse rx="10" ry="30"/><ellipse rx="10" ry="30" transform="rotate(30)"/><ellipse rx="10" ry="30" transform="rotate(60)"/><ellipse rx="10" ry="30" transform="rotate(90)"/><ellipse rx="10" ry="30" transform="rotate(120)"/><ellipse rx="10" ry="30" transform="rotate(150)"/>
    <circle r="11" fill="#fde68a"/>
  </g>
</g></g>
<!-- titles -->
<g class="r1">
<text x="70" y="190" class="t" font-size="60" font-weight="900" fill="#fff">장례비용</text>
<text x="70" y="270" class="t" font-size="60" font-weight="900" fill="#fff">상속세 공제</text>
</g>
<rect x="70" y="310" width="470" height="56" rx="28" fill="#fbbf24"/>
<text x="305" y="348" text-anchor="middle" class="t" font-size="27" font-weight="800" fill="#1e1b4b">최대 1,500만원 · 영수증이 핵심</text>
<text x="70" y="425" class="t" font-size="25" font-weight="500" fill="#c7d2fe">소득공제가 아닙니다 · 한도와 신고기한 정리</text>
</svg>
