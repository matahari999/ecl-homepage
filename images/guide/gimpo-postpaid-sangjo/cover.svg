<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="한강 하구 들녘 위 밤하늘과 국화, 촛불로 표현한 김포 후불제 상조 안내 그림">
<style>
  .t{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  @keyframes flick{0%,100%{transform:scale(1,1)}30%{transform:scale(.92,1.07)}60%{transform:scale(1.04,.96)}}
  @keyframes glow{0%,100%{opacity:.35}50%{opacity:.8}}
  @keyframes drift{to{transform:translateX(-140px)}}
  @keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
  .fl{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.8s ease-in-out infinite}
  .gl{animation:glow 3.6s ease-in-out infinite}
  .dr{animation:drift 9s linear infinite}
  .st{animation:tw 3.2s ease-in-out infinite}.s2{animation-delay:1.3s}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1230"/><stop offset="1" stop-color="#26205a"/></linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#fcd34d" stop-opacity=".85"/><stop offset="1" stop-color="#fcd34d" stop-opacity="0"/></radialGradient>
  <clipPath id="river"><rect x="0" y="470" width="1200" height="160"/></clipPath>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<g fill="#fff"><circle class="st" cx="720" cy="60" r="2.5"/><circle class="st s2" cx="1120" cy="90" r="2.5"/><circle class="st" cx="940" cy="40" r="2"/><circle class="st s2" cx="640" cy="150" r="2"/><circle class="st" cx="1010" cy="200" r="2"/></g>
<circle cx="1070" cy="140" r="42" fill="#f5ecd0" opacity=".9"/>
<circle cx="1088" cy="128" r="40" fill="#1a1a46"/>
<!-- fields -->
<path d="M0 430 Q300 400 600 425 T1200 415 V630 H0Z" fill="#1b2a52"/>
<path d="M0 470 Q300 452 600 470 T1200 462 V630 H0Z" fill="#203566"/>
<g clip-path="url(#river)"><g class="dr" stroke="#7aa2e3" stroke-width="3" fill="none" opacity=".55">
  <path d="M0 520 q35 -10 70 0 t70 0 t70 0 t70 0 t70 0 t70 0 t70 0 t70 0 t70 0 t70 0 t70 0 t70 0 t70 0 t70 0 t70 0 t70 0 t70 0 t70 0 t70 0 t70 0"/>
  <path d="M0 570 q35 -10 70 0 t70 0 t70 0 t70 0 t70 0 t70 0 t70 0 t70 0 t70 0 t70 0 t70 0 t70 0 t70 0 t70 0 t70 0 t70 0 t70 0 t70 0 t70 0 t70 0"/>
</g></g>
<!-- candle -->
<circle class="gl" cx="930" cy="330" r="90" fill="url(#halo)"/>
<rect x="905" y="350" width="50" height="120" rx="6" fill="#f5ecd0"/>
<path class="fl" d="M930 290 q-18 30 0 56 q18 -26 0 -56z" fill="#fcd34d"/>
<!-- chrysanthemums -->
<g transform="translate(1060 400)">
  <line x1="0" y1="0" x2="0" y2="80" stroke="#4d7c5a" stroke-width="5"/>
  <g fill="#f8f4e6"><ellipse rx="10" ry="30" cy="-20"/><ellipse rx="10" ry="30" cy="-20" transform="rotate(45)"/><ellipse rx="10" ry="30" cy="-20" transform="rotate(90)"/><ellipse rx="10" ry="30" cy="-20" transform="rotate(135)"/><ellipse rx="10" ry="30" cy="-20" transform="rotate(180)"/><ellipse rx="10" ry="30" cy="-20" transform="rotate(225)"/><ellipse rx="10" ry="30" cy="-20" transform="rotate(270)"/><ellipse rx="10" ry="30" cy="-20" transform="rotate(315)"/></g>
  <circle r="12" fill="#e8c96a"/>
</g>
<g transform="translate(800 420) scale(.75)">
  <line x1="0" y1="0" x2="0" y2="80" stroke="#4d7c5a" stroke-width="5"/>
  <g fill="#f8f4e6"><ellipse rx="10" ry="30" cy="-20"/><ellipse rx="10" ry="30" cy="-20" transform="rotate(60)"/><ellipse rx="10" ry="30" cy="-20" transform="rotate(120)"/><ellipse rx="10" ry="30" cy="-20" transform="rotate(180)"/><ellipse rx="10" ry="30" cy="-20" transform="rotate(240)"/><ellipse rx="10" ry="30" cy="-20" transform="rotate(300)"/></g>
  <circle r="12" fill="#e8c96a"/>
</g>
<text class="t" x="70" y="150" fill="#c9b8ff" font-size="30" font-weight="700">장례·요양 가이드</text>
<text class="t" x="70" y="235" fill="#ffffff" font-size="68" font-weight="800">김포 후불제 상조</text>
<text class="t" x="70" y="300" fill="#e6e1ff" font-size="32" font-weight="500">장례식장 6곳 · 관외 화장 · 비용 정리</text>
</svg>
