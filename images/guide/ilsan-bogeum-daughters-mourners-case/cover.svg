<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="새벽 하늘 아래 나란히 핀 두 송이 국화와 생화로 꾸민 꽃신, 촛불로 표현한 모친상 3일장 그림">
<style>
  .t{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
  @keyframes flick{0%,100%{transform:scale(1,1)}30%{transform:scale(.9,1.08)}60%{transform:scale(1.05,.95)}}
  @keyframes glow{0%,100%{opacity:.4}50%{opacity:.8}}
  @keyframes swayA{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
  @keyframes swayB{0%,100%{transform:rotate(2deg)}50%{transform:rotate(-2deg)}}
  @keyframes fall{0%{transform:translateY(-20px);opacity:0}20%{opacity:1}100%{transform:translateY(160px);opacity:0}}
  .s1{animation:tw 2.6s ease-in-out infinite}.s2{animation:tw 3.4s ease-in-out .8s infinite}.s3{animation:tw 4.2s ease-in-out 1.6s infinite}
  .fl{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.6s ease-in-out infinite}
  .gl{animation:glow 3.2s ease-in-out infinite}
  .fa{transform-origin:900px 565px;animation:swayA 6s ease-in-out infinite}
  .fb{transform-origin:1010px 565px;animation:swayB 6.5s ease-in-out infinite}
  .p1{animation:fall 5s linear infinite}.p2{animation:fall 6s linear 2s infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1638"/><stop offset=".75" stop-color="#3b2f5e"/><stop offset="1" stop-color="#6b4a6e"/></linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#fcd34d" stop-opacity=".8"/><stop offset="1" stop-color="#fcd34d" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<g fill="#fef9c3">
  <circle class="s1" cx="640" cy="60" r="3"/><circle class="s2" cx="780" cy="110" r="2.5"/><circle class="s3" cx="1120" cy="70" r="3"/>
  <circle class="s1" cx="960" cy="40" r="2"/><circle class="s3" cx="1080" cy="200" r="2.5"/><circle class="s2" cx="520" cy="300" r="2"/>
</g>
<rect x="0" y="565" width="1200" height="65" fill="#17122e"/>
<!-- 꽃신 -->
<g transform="translate(120 470)">
  <path d="M0 60 C 10 20, 60 8, 120 14 C 170 18, 200 40, 210 60 Z" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="3"/>
  <path d="M0 60 L210 60 L204 74 L6 74 Z" fill="#be185d"/>
  <g><circle cx="70" cy="24" r="12" fill="#f9a8d4"/><circle cx="92" cy="20" r="10" fill="#fde68a"/><circle cx="112" cy="26" r="11" fill="#ffffff"/><circle cx="70" cy="24" r="4" fill="#fbbf24"/><circle cx="112" cy="26" r="4" fill="#fbbf24"/></g>
</g>
<g transform="translate(350 470)">
  <path d="M0 60 C 10 20, 60 8, 120 14 C 170 18, 200 40, 210 60 Z" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="3"/>
  <path d="M0 60 L210 60 L204 74 L6 74 Z" fill="#be185d"/>
  <g><circle cx="70" cy="24" r="12" fill="#ffffff"/><circle cx="92" cy="20" r="10" fill="#f9a8d4"/><circle cx="112" cy="26" r="11" fill="#fde68a"/><circle cx="70" cy="24" r="4" fill="#fbbf24"/><circle cx="112" cy="26" r="4" fill="#fbbf24"/></g>
</g>
<circle class="p1" cx="300" cy="330" r="6" fill="#f9a8d4"/><circle class="p2" cx="460" cy="310" r="5" fill="#ffffff"/>
<!-- 촛불 -->
<circle class="gl" cx="720" cy="420" r="130" fill="url(#halo)"/>
<rect x="696" y="450" width="48" height="115" rx="8" fill="#fffdf7"/>
<line x1="720" y1="450" x2="720" y2="436" stroke="#57534e" stroke-width="3"/>
<path class="fl" d="M720 380 C 739 406, 737 425, 720 437 C 703 425, 701 406, 720 380 Z" fill="#f59e0b"/>
<path class="fl" d="M720 403 C 728 415, 727 425, 720 431 C 713 425, 712 415, 720 403 Z" fill="#fff7d6"/>
<!-- 두 송이 국화 -->
<g class="fa">
  <path d="M900 565 C 895 500, 912 450, 900 400" stroke="#4d7c0f" stroke-width="7" fill="none"/>
  <path d="M903 495 C 870 478, 846 482, 830 496 C 856 510, 882 510, 903 495 Z" fill="#65a30d"/>
  <g transform="translate(900 390)" fill="#ffffff" stroke="#e2e8f0">
    <ellipse rx="9" ry="36"/><ellipse rx="9" ry="36" transform="rotate(30)"/><ellipse rx="9" ry="36" transform="rotate(60)"/><ellipse rx="9" ry="36" transform="rotate(90)"/><ellipse rx="9" ry="36" transform="rotate(120)"/><ellipse rx="9" ry="36" transform="rotate(150)"/>
    <circle r="12" fill="#fde68a" stroke="none"/>
  </g>
</g>
<g class="fb">
  <path d="M1010 565 C 1015 510, 1000 470, 1010 430" stroke="#4d7c0f" stroke-width="7" fill="none"/>
  <g transform="translate(1010 420)" fill="#fbcfe8" stroke="#f9a8d4">
    <ellipse rx="8" ry="32"/><ellipse rx="8" ry="32" transform="rotate(30)"/><ellipse rx="8" ry="32" transform="rotate(60)"/><ellipse rx="8" ry="32" transform="rotate(90)"/><ellipse rx="8" ry="32" transform="rotate(120)"/><ellipse rx="8" ry="32" transform="rotate(150)"/>
    <circle r="11" fill="#fde68a" stroke="none"/>
  </g>
</g>
<text x="70" y="130" class="t" font-size="52" font-weight="900" fill="#ffffff">일산복음병원장례식장</text>
<text x="70" y="198" class="t" font-size="40" font-weight="900" fill="#fcd34d">두 딸이 상주가 된 모친상</text>
<text x="70" y="250" class="t" font-size="24" font-weight="700" fill="#e9d5ff">꽃신 입관 · 3일장 실제 진행 사례</text>
</svg>
