<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="동트기 전 하늘 아래 소나무가 선 언덕의 선영과 장례식장에서 이어지는 길, 국화와 촛불로 표현한 3일장 그림">
<style>
  .t{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
  @keyframes flick{0%,100%{transform:scale(1,1)}30%{transform:scale(.9,1.08)}60%{transform:scale(1.05,.95)}}
  @keyframes dawn{0%,100%{opacity:.35}50%{opacity:.7}}
  @keyframes drive{0%{transform:translateX(0)}100%{transform:translateX(330px)}}
  @keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
  .s1{animation:tw 2.6s ease-in-out infinite}.s2{animation:tw 3.4s ease-in-out .8s infinite}.s3{animation:tw 4.2s ease-in-out 1.6s infinite}
  .fl{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.6s ease-in-out infinite}
  .dw{animation:dawn 5s ease-in-out infinite}
  .car{animation:drive 9s linear infinite}
  .pine{transform-box:fill-box;transform-origin:50% 100%;animation:sway 7s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f1a3a"/><stop offset=".6" stop-color="#26305e"/><stop offset="1" stop-color="#4a3d6b"/></linearGradient>
  <radialGradient id="sun" cx=".5" cy="1" r=".6"><stop offset="0" stop-color="#fdba74" stop-opacity=".75"/><stop offset="1" stop-color="#fdba74" stop-opacity="0"/></radialGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#fcd34d" stop-opacity=".8"/><stop offset="1" stop-color="#fcd34d" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<ellipse class="dw" cx="950" cy="470" rx="420" ry="210" fill="url(#sun)"/>
<g fill="#fef9c3">
  <circle class="s1" cx="650" cy="60" r="3"/><circle class="s2" cx="800" cy="100" r="2.5"/><circle class="s3" cx="1120" cy="60" r="3"/>
  <circle class="s1" cx="980" cy="36" r="2"/><circle class="s3" cx="560" cy="170" r="2"/><circle class="s2" cx="1050" cy="150" r="2"/>
</g>
<!-- 언덕(선영) -->
<path d="M560 520 C 720 380, 900 360, 1200 410 L1200 630 L560 630 Z" fill="#1d2448"/>
<path d="M0 560 C 300 520, 600 530, 1200 500 L1200 630 L0 630 Z" fill="#141a36"/>
<!-- 소나무 -->
<g class="pine" fill="#0b2a2a">
  <path d="M900 400 l-34 0 l34 -40 l-26 0 l26 -32 l-18 0 l18 -26 l18 26 l-18 0 l26 32 l-26 0 l34 40 z"/>
  <rect x="896" y="398" width="8" height="18"/>
</g>
<g class="pine" fill="#0b2a2a">
  <path d="M1010 392 l-28 0 l28 -34 l-21 0 l21 -26 l-15 0 l15 -22 l15 22 l-15 0 l21 26 l-21 0 l28 34 z"/>
  <rect x="1006" y="390" width="7" height="16"/>
</g>
<!-- 봉분 -->
<ellipse cx="955" cy="430" rx="46" ry="16" fill="#2f3b6b"/>
<!-- 길 -->
<path d="M120 600 C 380 560, 620 520, 900 452" fill="none" stroke="#fcd34d" stroke-opacity=".35" stroke-width="4" stroke-dasharray="10 12"/>
<g class="car"><g transform="translate(250 560)"><rect x="0" y="0" width="46" height="16" rx="5" fill="#e2e8f0"/><circle cx="10" cy="17" r="4" fill="#94a3b8"/><circle cx="36" cy="17" r="4" fill="#94a3b8"/></g></g>
<!-- 국화와 촛불 -->
<g transform="translate(120 470)">
  <circle cx="0" cy="0" r="70" fill="url(#halo)" opacity=".5"/>
  <rect x="-12" y="10" width="24" height="70" rx="4" fill="#fef3c7"/>
  <path class="fl" d="M0 -26 C 10 -10, 10 4, 0 8 C -10 4, -10 -10, 0 -26 Z" fill="#fbbf24"/>
</g>
<g transform="translate(210 510)">
  <path d="M0 70 L0 0" stroke="#4d7c0f" stroke-width="4"/>
  <g fill="#f8fafc"><ellipse cx="0" cy="-12" rx="9" ry="20"/><ellipse cx="0" cy="-12" rx="9" ry="20" transform="rotate(45 0 -12)"/><ellipse cx="0" cy="-12" rx="9" ry="20" transform="rotate(90 0 -12)"/><ellipse cx="0" cy="-12" rx="9" ry="20" transform="rotate(135 0 -12)"/></g>
  <circle cx="0" cy="-12" r="7" fill="#fde68a"/>
</g>
<text class="t" x="70" y="150" fill="#fde68a" font-size="28" font-weight="700">고양 일산 · 일반장례 3일장</text>
<text class="t" x="70" y="230" fill="#ffffff" font-size="64" font-weight="800">일산복음병원장례식장</text>
<text class="t" x="70" y="300" fill="#e0e7ff" font-size="34" font-weight="500">화장 후 김포 선영 안치까지</text>
<text class="t" x="70" y="350" fill="#c7d2fe" font-size="26">실제 진행 사례 · 이음케어라이프</text>
</svg>
