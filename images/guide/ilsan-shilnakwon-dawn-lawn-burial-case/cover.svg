<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="새벽 하늘 아래 장의차가 잔디 언덕을 향해 달리는 그림">
<style>
  .t{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  @keyframes drive{0%{transform:translateX(0)}100%{transform:translateX(420px)}}
  @keyframes star{0%,100%{opacity:.15}50%{opacity:.9}}
  @keyframes rise{0%{transform:translateY(30px);opacity:.3}100%{transform:translateY(0);opacity:1}}
  @keyframes road{to{stroke-dashoffset:-60}}
  .car{animation:drive 9s ease-in-out infinite alternate}
  .s1{animation:star 3s ease-in-out infinite}.s2{animation:star 4s ease-in-out 1s infinite}.s3{animation:star 3.6s ease-in-out 2s infinite}
  .dawn{animation:rise 9s ease-in-out infinite alternate}
  .rd{stroke-dasharray:30 30;animation:road 1.2s linear infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1630"/><stop offset=".55" stop-color="#2e3d6b"/><stop offset="1" stop-color="#e9b98a"/></linearGradient>
  <radialGradient id="g"><stop offset="0" stop-color="#ffd9a0"/><stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="630" fill="url(#sky)"/>
<circle class="s1" cx="160" cy="230" r="2.5" fill="#fff"/><circle class="s2" cx="420" cy="210" r="2" fill="#fff"/><circle class="s3" cx="760" cy="230" r="2.5" fill="#fff"/><circle class="s1" cx="1120" cy="210" r="2" fill="#fff"/>
<g class="dawn"><circle cx="980" cy="470" r="170" fill="url(#g)" opacity=".8"/></g>
<!-- 잔디 언덕 -->
<path d="M700 470 Q900 360 1200 420 V500 H700 Z" fill="#5d8a5a"/>
<g fill="#7fb07a"><rect x="880" y="410" width="60" height="10" rx="5"/><rect x="960" y="402" width="60" height="10" rx="5"/><rect x="1040" y="408" width="60" height="10" rx="5"/></g>
<!-- 장례식장 -->
<g><rect x="60" y="330" width="230" height="160" rx="6" fill="#1b2548"/>
<g fill="#fde3a7" opacity=".85"><rect x="85" y="360" width="32" height="24" rx="3"/><rect x="135" y="360" width="32" height="24" rx="3"/><rect x="185" y="360" width="32" height="24" rx="3"/><rect x="235" y="360" width="32" height="24" rx="3"/></g>
<rect x="150" y="420" width="50" height="70" rx="4" fill="#0d1630"/>
<text x="175" y="318" text-anchor="middle" class="t" font-size="18" font-weight="700" fill="#cbd5e1">장례식장</text></g>
<text x="1000" y="392" text-anchor="middle" class="t" font-size="18" font-weight="700" fill="#f1f5f9">잔디장</text>
<rect x="0" y="490" width="1200" height="140" fill="#10182e"/>
<line class="rd" x1="0" y1="560" x2="1200" y2="560" stroke="#fde3a7" stroke-width="5" opacity=".55"/>
<!-- 리무진 -->
<g class="car"><g transform="translate(240 480)">
  <rect x="0" y="0" width="260" height="56" rx="12" fill="#151515" stroke="#3a3a3a"/>
  <rect x="30" y="-20" width="170" height="30" rx="10" fill="#1f1f1f"/>
  <rect x="44" y="-14" width="70" height="18" rx="3" fill="#5b6b8f"/><rect x="122" y="-14" width="70" height="18" rx="3" fill="#5b6b8f"/>
  <rect x="236" y="20" width="18" height="10" rx="3" fill="#fde68a"/>
  <circle cx="50" cy="58" r="17" fill="#000"/><circle cx="50" cy="58" r="7" fill="#9ca3af"/>
  <circle cx="210" cy="58" r="17" fill="#000"/><circle cx="210" cy="58" r="7" fill="#9ca3af"/>
</g></g>
<text x="60" y="112" class="t" font-size="48" font-weight="900" fill="#fff">일산쉴낙원병원장례식장 3일장</text>
<text x="60" y="164" class="t" font-size="26" font-weight="700" fill="#cbd5e1">새벽 발인 · 서울시립승화원 화장 · 용인 잔디장 · 실제 진행 사례</text>
</svg>
