<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="어두운 남색 배경에 촛불 하나와 흰 국화 한 송이를 그리고, 빈소 대신 가족만 모이는 무빈소 장례 비용을 설명하는 제목을 넣은 일러스트">
<style>
  .t{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  @keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.92,1.08)}}
  @keyframes halo{0%,100%{opacity:.35}50%{opacity:.6}}
  @keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
  @keyframes star{0%,100%{opacity:.25}50%{opacity:.9}}
  .fl{transform-origin:900px 330px;animation:flick 2.6s ease-in-out infinite}
  .halo{animation:halo 5s ease-in-out infinite}
  .flower{transform-origin:1040px 600px;animation:sway 8s ease-in-out infinite}
  .s{animation:star 6s ease-in-out infinite}.s2{animation-delay:2s}.s3{animation-delay:4s}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e1533"/><stop offset="1" stop-color="#2a2458"/></linearGradient><radialGradient id="hg"><stop offset="0" stop-color="#fde68a" stop-opacity=".9"/><stop offset="1" stop-color="#fde68a" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<g fill="#e2e8f0"><circle class="s" cx="640" cy="60" r="2.5"/><circle class="s s2" cx="760" cy="110" r="2"/><circle class="s s3" cx="1120" cy="70" r="2.5"/><circle class="s s2" cx="1000" cy="40" r="2"/></g>
<text x="70" y="110" class="t" font-size="28" font-weight="700" fill="#fcd34d">빈소 없이 가족만 모시는 장례</text>
<text x="70" y="190" class="t" font-size="66" font-weight="900" fill="#ffffff">무빈소 장례 비용</text>
<text x="70" y="250" class="t" font-size="28" fill="#cbd5e1">빠지는 비용 2가지 · 남는 비용 6가지</text>
<!-- cards -->
<g class="t">
  <rect x="70" y="320" width="300" height="230" rx="18" fill="#1b2350" stroke="#475099" stroke-width="2"/>
  <text x="100" y="368" font-size="26" font-weight="800" fill="#fca5a5">빠지는 비용</text>
  <text x="100" y="420" font-size="24" fill="#e2e8f0">· 빈소 사용료</text>
  <text x="100" y="462" font-size="24" fill="#e2e8f0">· 조문객 음식</text>
  <rect x="400" y="320" width="330" height="230" rx="18" fill="#1b2350" stroke="#475099" stroke-width="2"/>
  <text x="430" y="368" font-size="26" font-weight="800" fill="#86efac">남는 비용</text>
  <text x="430" y="420" font-size="24" fill="#e2e8f0">· 안치·입관·운구</text>
  <text x="430" y="462" font-size="24" fill="#e2e8f0">· 관·수의</text>
  <text x="430" y="504" font-size="24" fill="#e2e8f0">· 화장·장지</text>
</g>
<!-- table + candle -->
<rect x="790" y="470" width="300" height="20" rx="6" fill="#3b3f7a"/>
<rect x="815" y="490" width="16" height="110" fill="#3b3f7a"/><rect x="1049" y="490" width="16" height="110" fill="#3b3f7a"/>
<circle class="halo" cx="900" cy="330" r="110" fill="url(#hg)"/>
<rect x="880" y="360" width="40" height="110" rx="6" fill="#f8f1dc"/>
<line x1="900" y1="360" x2="900" y2="344" stroke="#334155" stroke-width="3"/>
<path class="fl" d="M900 296 C915 318 916 336 900 346 C884 336 885 318 900 296 Z" fill="#fbbf24"/>
<path class="fl" d="M900 314 C907 326 907 336 900 341 C893 336 893 326 900 314 Z" fill="#fff7d6"/>
<!-- chrysanthemum -->
<g class="flower">
  <path d="M1040 600 C1036 540 1030 500 1022 450" stroke="#4d7c5a" stroke-width="6" fill="none"/>
  <path d="M1030 530 C1050 515 1070 515 1080 520 C1066 535 1048 538 1030 530 Z" fill="#4d7c5a"/>
  <g transform="translate(1020 440)" fill="#f8fafc">
    <ellipse rx="10" ry="34" transform="rotate(0)"/><ellipse rx="10" ry="34" transform="rotate(30)"/><ellipse rx="10" ry="34" transform="rotate(60)"/>
    <ellipse rx="10" ry="34" transform="rotate(90)"/><ellipse rx="10" ry="34" transform="rotate(120)"/><ellipse rx="10" ry="34" transform="rotate(150)"/>
    <circle r="12" fill="#fde68a"/>
  </g>
</g>
</svg>
