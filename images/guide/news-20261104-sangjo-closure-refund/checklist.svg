<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="내 상조 확인부터 폐업 시 피해보상금 청구 또는 내상조 그대로 선택까지의 흐름">
<style>
  .t{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  @keyframes in{0%,8%{opacity:0;transform:translateY(12px)}18%,100%{opacity:1;transform:translateY(0)}}
  .s1{animation:in 9s ease-out infinite}.s2{animation:in 9s ease-out 1s infinite}.s3{animation:in 9s ease-out 2s infinite}.s4{animation:in 9s ease-out 3s infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="640" fill="#131c3d"/>
<text x="600" y="62" text-anchor="middle" class="t" font-size="34" font-weight="900" fill="#fff">내 상조, 이렇게 확인하세요</text>
<g class="t">
  <g class="s1">
    <rect x="390" y="100" width="420" height="110" rx="20" fill="#1e3a8a" stroke="#93c5fd" stroke-width="3"/>
    <text x="600" y="145" text-anchor="middle" font-size="27" font-weight="800" fill="#fff">① 내상조 찾아줘 조회</text>
    <text x="600" y="185" text-anchor="middle" font-size="21" fill="#cbd5e1">가입 업체 · 낸 돈 · 영업 상태 확인</text>
  </g>
  <path d="M600 212 V250 M600 250 H300 V285 M600 250 H900 V285" fill="none" stroke="#64748b" stroke-width="4"/>
  <g class="s2">
    <rect x="80" y="290" width="440" height="140" rx="20" fill="#14532d" stroke="#86efac" stroke-width="3"/>
    <text x="300" y="335" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">② 영업 중이면</text>
    <text x="300" y="375" text-anchor="middle" font-size="21" fill="#dcfce7">선수금 보전기관(은행·공제조합)</text>
    <text x="300" y="405" text-anchor="middle" font-size="21" fill="#dcfce7">공지와 해지 환급 조건 확인</text>
  </g>
  <g class="s3">
    <rect x="680" y="290" width="440" height="140" rx="20" fill="#7c2d12" stroke="#fdba74" stroke-width="3"/>
    <text x="900" y="335" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">③ 폐업·등록취소면</text>
    <text x="900" y="375" text-anchor="middle" font-size="21" fill="#ffedd5">보전기관에 피해보상금 청구</text>
    <text x="900" y="405" text-anchor="middle" font-size="21" fill="#ffedd5">공제조합은 청구기한 꼭 확인</text>
  </g>
  <path d="M900 432 V470" fill="none" stroke="#64748b" stroke-width="4"/>
  <g class="s4">
    <rect x="560" y="475" width="560" height="130" rx="20" fill="#3b2a6b" stroke="#c4b5fd" stroke-width="3"/>
    <text x="840" y="520" text-anchor="middle" font-size="25" font-weight="800" fill="#fff">④ 둘 중 선택</text>
    <text x="840" y="560" text-anchor="middle" font-size="21" fill="#ede9fe">보상금 받기(낸 돈의 50%까지) 또는</text>
    <text x="840" y="590" text-anchor="middle" font-size="21" fill="#ede9fe">내상조 그대로(낸 돈 인정, 참여사 이용)</text>
  </g>
  <text x="80" y="540" font-size="22" fill="#94a3b8">※ 기한·조건은 업체와 보전기관마다</text>
  <text x="80" y="572" font-size="22" fill="#94a3b8">   다르니 공지를 직접 확인하세요.</text>
</g>
</svg>
