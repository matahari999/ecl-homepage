<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="상조 계약서를 돋보기로 살펴보는 모습과 국화, 이름만 믿은 상조 피해를 알리는 일러스트">
<style>
  .t{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  @keyframes scan{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,70px)}}
  @keyframes glow{0%,100%{opacity:.35}50%{opacity:.9}}
  @keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
  @keyframes tick{0%,30%{opacity:0}45%,100%{opacity:1}}
  .lens{animation:scan 10s ease-in-out infinite}
  .halo{animation:glow 5s ease-in-out infinite}
  .flower{transform-origin:110px 600px;animation:sway 7s ease-in-out infinite}
  .k1{animation:tick 6s ease-in-out infinite}
  .k2{animation:tick 6s ease-in-out 1s infinite}
  .k3{animation:tick 6s ease-in-out 2s infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1736"/><stop offset="1" stop-color="#2b2458"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="1050" cy="110" r="160" fill="#323a74" opacity=".45"/>
<text x="70" y="100" class="t" font-size="28" font-weight="700" fill="#fcd34d">2026년 11월 장례·상조 소식</text>
<text x="70" y="168" class="t" font-size="54" font-weight="900" fill="#ffffff">이름만 믿은 상조, 700억 피해</text>
<text x="70" y="220" class="t" font-size="27" fill="#cbd5e1">가입한 상조회사 지금 확인하는 4단계</text>
<!-- document -->
<g transform="translate(700,270)">
  <rect x="0" y="0" width="300" height="320" rx="18" fill="#f8f3e6"/>
  <rect x="30" y="34" width="180" height="18" rx="9" fill="#1e2a5a"/>
  <rect x="30" y="90" width="26" height="26" rx="6" fill="none" stroke="#1e2a5a" stroke-width="4"/>
  <rect x="72" y="96" width="190" height="14" rx="7" fill="#9aa3c7"/>
  <rect x="30" y="150" width="26" height="26" rx="6" fill="none" stroke="#1e2a5a" stroke-width="4"/>
  <rect x="72" y="156" width="170" height="14" rx="7" fill="#9aa3c7"/>
  <rect x="30" y="210" width="26" height="26" rx="6" fill="none" stroke="#1e2a5a" stroke-width="4"/>
  <rect x="72" y="216" width="150" height="14" rx="7" fill="#9aa3c7"/>
  <path class="k1" d="M34 103 l8 8 l14 -16" stroke="#16a34a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path class="k2" d="M34 163 l8 8 l14 -16" stroke="#16a34a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path class="k3" d="M34 223 l8 8 l14 -16" stroke="#16a34a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <rect x="30" y="270" width="110" height="20" rx="10" fill="#d6c9a6"/>
</g>
<!-- magnifier -->
<g class="lens">
  <circle class="halo" cx="1030" cy="360" r="78" fill="#fcd34d" opacity=".4"/>
  <circle cx="1030" cy="360" r="62" fill="#ffffff" fill-opacity=".12" stroke="#fcd34d" stroke-width="10"/>
  <rect x="1070" y="405" width="22" height="90" rx="10" fill="#fcd34d" transform="rotate(-40 1081 450)"/>
</g>
<!-- chrysanthemum -->
<g class="flower">
  <path d="M110 600 C 112 520, 120 470, 130 420" stroke="#4d7c5a" stroke-width="6" fill="none"/>
  <g transform="translate(130,410)" fill="#f5efe0">
    <ellipse rx="12" ry="34" transform="rotate(0)"/><ellipse rx="12" ry="34" transform="rotate(30)"/>
    <ellipse rx="12" ry="34" transform="rotate(60)"/><ellipse rx="12" ry="34" transform="rotate(90)"/>
    <ellipse rx="12" ry="34" transform="rotate(120)"/><ellipse rx="12" ry="34" transform="rotate(150)"/>
    <circle r="14" fill="#e9d38a"/>
  </g>
</g>
<g transform="translate(250,450)">
  <rect width="360" height="110" rx="16" fill="#1d2550" stroke="#4b5694" stroke-width="2"/>
  <text x="28" y="48" class="t" font-size="24" font-weight="700" fill="#fcd34d">폐업 시 현금 보상</text>
  <text x="28" y="86" class="t" font-size="24" fill="#e2e8f0">낸 돈의 50%까지</text>
</g>
</svg>
