<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="밤하늘 아래 산과 바다 위로 고운 골분이 바람에 흩어지는 모습과 국화를 그린 일러스트">
<style>
  .t{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  @keyframes drift{0%{transform:translate(0,0);opacity:0}20%{opacity:.9}100%{transform:translate(160px,-70px);opacity:0}}
  @keyframes wave{0%,100%{transform:translateX(0)}50%{transform:translateX(-24px)}}
  @keyframes glow{0%,100%{opacity:.35}50%{opacity:.8}}
  @keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
  .p{animation:drift 8s ease-out infinite}
  .p2{animation-delay:2s}.p3{animation-delay:4s}.p4{animation-delay:6s}
  .w{animation:wave 9s ease-in-out infinite}
  .moon{animation:glow 6s ease-in-out infinite}
  .flower{transform-origin:110px 610px;animation:sway 7s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1430"/><stop offset="1" stop-color="#252456"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle class="moon" cx="1070" cy="95" r="46" fill="#fde68a"/>
<circle cx="1070" cy="95" r="90" fill="#fde68a" opacity=".08"/>
<text x="70" y="100" class="t" font-size="28" font-weight="700" fill="#fcd34d">2026년 11월 장례·상조 소식</text>
<text x="70" y="168" class="t" font-size="58" font-weight="900" fill="#ffffff">산분장, 어디서 할 수 있나</text>
<text x="70" y="222" class="t" font-size="27" fill="#cbd5e1">울산 1월 산분장 운영 · 고양·파주는 용미리 무료</text>
<!-- mountains -->
<path d="M560 470 L760 270 L900 400 L1010 300 L1200 470 Z" fill="#3b3f7a"/>
<path d="M760 270 L800 310 L770 318 L740 300 Z" fill="#e2e8f0" opacity=".7"/>
<path d="M480 470 L640 360 L760 470 Z" fill="#2f3368"/>
<!-- sea -->
<rect x="0" y="470" width="1200" height="160" fill="#16224a"/>
<g class="w" stroke="#5b7bc4" stroke-width="3" fill="none" opacity=".7">
  <path d="M320 510 q30 -14 60 0 t60 0 t60 0 t60 0"/>
  <path d="M640 545 q30 -14 60 0 t60 0 t60 0 t60 0 t60 0"/>
  <path d="M420 590 q30 -14 60 0 t60 0 t60 0"/>
  <path d="M900 595 q30 -14 60 0 t60 0 t60 0"/>
</g>
<!-- drifting ash particles -->
<g fill="#f8fafc">
  <g class="p"><circle cx="820" cy="330" r="4"/><circle cx="840" cy="320" r="3"/><circle cx="805" cy="345" r="2.5"/></g>
  <g class="p p2"><circle cx="760" cy="360" r="3.5"/><circle cx="785" cy="350" r="2.5"/></g>
  <g class="p p3"><circle cx="860" cy="350" r="3"/><circle cx="880" cy="338" r="2"/><circle cx="845" cy="365" r="2.5"/></g>
  <g class="p p4"><circle cx="800" cy="300" r="3"/><circle cx="825" cy="292" r="2"/></g>
</g>
<!-- chrysanthemum -->
<g class="flower">
  <path d="M110 610 C110 560 120 520 135 470" stroke="#4d7c5a" stroke-width="6" fill="none"/>
  <path d="M118 550 q-40 -10 -50 -40 q35 5 50 40z" fill="#4d7c5a"/>
  <g transform="translate(135 455)" fill="#fffbeb">
    <ellipse rx="10" ry="34" transform="rotate(0)"/><ellipse rx="10" ry="34" transform="rotate(30)"/>
    <ellipse rx="10" ry="34" transform="rotate(60)"/><ellipse rx="10" ry="34" transform="rotate(90)"/>
    <ellipse rx="10" ry="34" transform="rotate(120)"/><ellipse rx="10" ry="34" transform="rotate(150)"/>
    <circle r="13" fill="#fcd34d"/>
  </g>
</g>
</svg>
