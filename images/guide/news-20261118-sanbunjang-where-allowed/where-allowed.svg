<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="산분장이 가능한 곳과 안 되는 곳 비교: 해안선 5km 이상 바다와 산분 시설이 마련된 장사시설은 가능, 시설 없는 선산과 해안선 5km 이내 바다는 불가">
<style>
  .t{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  @keyframes fadeUp{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
  .r{opacity:0;animation:fadeUp 1.2s ease-out forwards}
  .d1{animation-delay:.3s}.d2{animation-delay:.9s}.d3{animation-delay:1.5s}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.r{opacity:1}}
</style>
<rect width="1200" height="720" fill="#111a3a"/>
<text x="600" y="70" text-anchor="middle" class="t" font-size="36" font-weight="900" fill="#ffffff">산분장(골분 뿌리기) 가능한 곳 · 안 되는 곳</text>
<text x="600" y="112" text-anchor="middle" class="t" font-size="22" fill="#cbd5e1">장사법 시행령 기준, 2025년 1월 24일부터 시행</text>

<!-- left: allowed -->
<rect x="60" y="150" width="520" height="520" rx="22" fill="#14324a" stroke="#34d399" stroke-width="3"/>
<circle cx="120" cy="205" r="26" fill="#34d399"/>
<path d="M107 205 l9 10 l18 -20" stroke="#0b2a22" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="165" y="215" class="t" font-size="32" font-weight="800" fill="#a7f3d0">가능한 곳</text>
<g class="r d1">
  <rect x="90" y="260" width="460" height="170" rx="14" fill="#1b4560"/>
  <text x="115" y="305" class="t" font-size="28" font-weight="800" fill="#ffffff">① 바다(해양장)</text>
  <text x="115" y="350" class="t" font-size="23" fill="#e2e8f0">해안선에서 5km 이상 떨어진 곳</text>
  <text x="115" y="388" class="t" font-size="23" fill="#e2e8f0">수면 가까이 · 골분과 생화만</text>
</g>
<g class="r d2">
  <rect x="90" y="455" width="460" height="190" rx="14" fill="#1b4560"/>
  <text x="115" y="500" class="t" font-size="28" font-weight="800" fill="#ffffff">② 산분 시설이 있는 곳</text>
  <text x="115" y="545" class="t" font-size="23" fill="#e2e8f0">묘지 · 화장시설 · 봉안시설 ·</text>
  <text x="115" y="580" class="t" font-size="23" fill="#e2e8f0">자연장지 중 산분 구역을 갖춘 곳</text>
  <text x="115" y="618" class="t" font-size="21" fill="#fcd34d">예: 서울시립승화원 유택동산 등</text>
</g>

<!-- right: not allowed -->
<rect x="620" y="150" width="520" height="520" rx="22" fill="#3a1d33" stroke="#f87171" stroke-width="3"/>
<circle cx="680" cy="205" r="26" fill="#f87171"/>
<path d="M669 194 l22 22 M691 194 l-22 22" stroke="#3a0d16" stroke-width="6" stroke-linecap="round"/>
<text x="725" y="215" class="t" font-size="32" font-weight="800" fill="#fecaca">안 되는 곳</text>
<g class="r d2">
  <rect x="650" y="260" width="460" height="120" rx="14" fill="#4f2741"/>
  <text x="675" y="305" class="t" font-size="27" font-weight="800" fill="#ffffff">산분 시설 없는 선산·임야</text>
  <text x="675" y="347" class="t" font-size="22" fill="#e2e8f0">땅 종류가 아니라 시설 유무가 기준</text>
</g>
<g class="r d3">
  <rect x="650" y="400" width="460" height="110" rx="14" fill="#4f2741"/>
  <text x="675" y="445" class="t" font-size="27" font-weight="800" fill="#ffffff">해안선 5km 안쪽 바다</text>
  <text x="675" y="485" class="t" font-size="22" fill="#e2e8f0">해수욕장·갯바위 등 가까운 바다</text>
</g>
<g class="r d3">
  <rect x="650" y="530" width="460" height="115" rx="14" fill="#4f2741"/>
  <text x="675" y="575" class="t" font-size="27" font-weight="800" fill="#ffffff">유골함·유품을 바다에</text>
  <text x="675" y="615" class="t" font-size="22" fill="#e2e8f0">바다에는 골분과 생화만 허용</text>
</g>
</svg>
