<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="서울 시립 화장시설 하루 화장 가능 건수 비교 막대 그래프">
<style>
  .t{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  @keyframes grow{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
  .b{transform-box:fill-box;transform-origin:0 50%;animation:grow 1.4s ease-out both}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="640" rx="20" fill="#13193a"/>
<text x="60" y="75" class="t" font-size="34" font-weight="900" fill="#ffffff">서울 시립 화장시설 하루 화장 가능 건수</text>
<text x="60" y="115" class="t" font-size="22" fill="#94a3b8">서울시립승화원(고양) + 서울추모공원(서초) · 2026년 11월 서울시 자료</text>
<!-- scale: 1건 = 3.6px, bars start x=300 -->
<g class="t">
  <text x="60" y="198" font-size="24" font-weight="700" fill="#e2e8f0">2023년</text>
  <rect class="b" x="300" y="170" width="515" height="44" rx="8" fill="#64748b"/>
  <text x="830" y="201" font-size="26" font-weight="700" fill="#e2e8f0">143건</text>

  <text x="60" y="298" font-size="24" font-weight="700" fill="#e2e8f0">2026년</text>
  <rect class="b" x="300" y="270" width="472" height="44" rx="8" fill="#fcd34d" style="animation-delay:.2s"/>
  <rect class="b" x="772" y="270" width="306" height="44" rx="8" fill="#fb923c" style="animation-delay:.4s"/>
  <text x="536" y="301" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">승화원 131</text>
  <text x="925" y="301" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">추모공원 85</text>
  <text x="1090" y="301" font-size="26" font-weight="700" fill="#fde68a">216</text>

  <text x="60" y="398" font-size="24" font-weight="700" fill="#e2e8f0">하루 수요</text>
  <rect class="b" x="300" y="370" width="605" height="44" rx="8" fill="#38bdf8" style="animation-delay:.6s"/>
  <text x="920" y="401" font-size="26" font-weight="700" fill="#e2e8f0">168건</text>
  <text x="60" y="428" font-size="17" fill="#94a3b8">(9월 말 평균)</text>
</g>
<line x1="60" y1="470" x2="1140" y2="470" stroke="#334155" stroke-width="2"/>
<g class="t">
  <rect x="60" y="500" width="330" height="100" rx="14" fill="#1e2552"/>
  <text x="225" y="545" text-anchor="middle" font-size="22" fill="#cbd5e1">3일차 화장률 (9월)</text>
  <text x="225" y="583" text-anchor="middle" font-size="30" font-weight="900" fill="#fde68a">76.2%</text>
  <rect x="435" y="500" width="330" height="100" rx="14" fill="#1e2552"/>
  <text x="600" y="545" text-anchor="middle" font-size="22" fill="#cbd5e1">1회 화장 시간 (승화원)</text>
  <text x="600" y="583" text-anchor="middle" font-size="30" font-weight="900" fill="#fde68a">120분 → 100분</text>
  <rect x="810" y="500" width="330" height="100" rx="14" fill="#1e2552"/>
  <text x="975" y="545" text-anchor="middle" font-size="22" fill="#cbd5e1">하루 여유</text>
  <text x="975" y="583" text-anchor="middle" font-size="30" font-weight="900" fill="#fde68a">약 48건</text>
</g>
</svg>
