<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="화장장 건물과 달력, 하루 화장 가능 건수가 늘어나는 막대를 표현한 일러스트">
<style>
  .t{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  @keyframes grow{0%{transform:scaleY(.15)}100%{transform:scaleY(1)}}
  @keyframes glow{0%,100%{opacity:.3}50%{opacity:.75}}
  @keyframes flick{0%,100%{transform:scale(1)}50%{transform:scale(1.08,.94)}}
  .bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 4s ease-out infinite alternate}
  .halo{animation:glow 6s ease-in-out infinite}
  .flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 3s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1736"/><stop offset="1" stop-color="#2b2559"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="1050" cy="110" r="160" fill="#2f356e" opacity=".45"/>
<text x="70" y="105" class="t" font-size="28" font-weight="700" fill="#fcd34d">2026년 11월 장례·화장 소식</text>
<text x="70" y="175" class="t" font-size="54" font-weight="900" fill="#ffffff">화장 하루 216건으로 확대</text>
<text x="70" y="230" class="t" font-size="27" fill="#cbd5e1">승화원 131건 · 3일차 화장률 76.2% · 예약 확인 4가지</text>
<!-- bars -->
<g transform="translate(90 560)">
  <line x1="0" y1="0" x2="430" y2="0" stroke="#64748b" stroke-width="3"/>
  <rect class="bar" x="40" y="-143" width="110" height="143" rx="8" fill="#64748b"/>
  <rect class="bar" x="240" y="-216" width="110" height="216" rx="8" fill="#fcd34d" style="animation-delay:.6s"/>
  <text x="95" y="-160" text-anchor="middle" class="t" font-size="26" font-weight="700" fill="#e2e8f0">143</text>
  <text x="295" y="-233" text-anchor="middle" class="t" font-size="26" font-weight="700" fill="#fde68a">216</text>
</g>
<text x="185" y="600" text-anchor="middle" class="t" font-size="20" fill="#94a3b8">2023년</text>
<text x="385" y="600" text-anchor="middle" class="t" font-size="20" fill="#94a3b8">2026년</text>
<!-- building -->
<g transform="translate(700 330)">
  <circle class="halo" cx="160" cy="110" r="150" fill="#fde68a" opacity=".35"/>
  <rect x="40" y="90" width="240" height="140" rx="8" fill="#e9e3d3"/>
  <polygon points="20,96 160,20 300,96" fill="#c7bfa8"/>
  <rect x="135" y="160" width="50" height="70" fill="#8b7f66"/>
  <rect x="65" y="125" width="40" height="34" rx="4" fill="#a8a08a"/>
  <rect x="215" y="125" width="40" height="34" rx="4" fill="#a8a08a"/>
  <rect x="228" y="30" width="26" height="52" fill="#c7bfa8"/>
  <rect x="0" y="230" width="320" height="14" rx="4" fill="#3b4285"/>
</g>
<!-- candle -->
<g transform="translate(1090 470)">
  <rect x="0" y="20" width="30" height="80" rx="4" fill="#f8f4e8"/>
  <path class="flame" d="M15 -10 C 25 5, 25 15, 15 20 C 5 15, 5 5, 15 -10 Z" fill="#fbbf24"/>
</g>
<!-- calendar -->
<g transform="translate(580 330)">
  <rect width="100" height="96" rx="10" fill="#f1f5f9"/>
  <rect width="100" height="28" rx="10" fill="#ef4444"/>
  <rect y="18" width="100" height="10" fill="#ef4444"/>
  <text x="50" y="80" text-anchor="middle" class="t" font-size="40" font-weight="900" fill="#1e293b">3</text>
</g>
</svg>
