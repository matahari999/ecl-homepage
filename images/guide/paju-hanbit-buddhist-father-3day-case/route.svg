<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-label="1일차 접수, 2일차 불교식 입관, 3일차 새벽 발인 후 파주에서 충남 홍성추모공원 봉안까지 이어지는 일정 그림">
<style>
  .t{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  @keyframes move{0%{offset-distance:0%}100%{offset-distance:100%}}
  @keyframes pulse{0%,100%{r:10}50%{r:15}}
  @keyframes dash{to{stroke-dashoffset:-60}}
  .car{offset-path:path('M190 420 C 330 400, 420 520, 560 500 S 760 440, 820 520');animation:move 6s ease-in-out infinite}
  .pl{animation:pulse 2.4s ease-in-out infinite}
  .rd{animation:dash 2s linear infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.car{offset-distance:60%}}
</style>
<rect width="1000" height="620" rx="24" fill="#faf7f2"/>
<text class="t" x="40" y="62" font-size="30" font-weight="800" fill="#3b2f55">3일 일정과 셋째 날의 긴 이동</text>
<!-- 날짜 카드 -->
<g class="t">
  <rect x="40" y="96" width="290" height="170" rx="16" fill="#fff" stroke="#e7dccb" stroke-width="2"/>
  <rect x="40" y="96" width="290" height="46" rx="16" fill="#a78bfa"/><rect x="40" y="126" width="290" height="16" fill="#a78bfa"/>
  <text x="62" y="128" font-size="22" font-weight="700" fill="#fff">1일차</text>
  <text x="62" y="180" font-size="21" fill="#3f3a4a">접수 · 안치 · 빈소 마련</text>
  <text x="62" y="214" font-size="21" fill="#3f3a4a">장지·이동 시간 먼저 확인</text>
  <text x="62" y="248" font-size="18" fill="#7c7488">불교식 진행 방향 확정</text>

  <rect x="355" y="96" width="290" height="170" rx="16" fill="#fff" stroke="#e7dccb" stroke-width="2"/>
  <rect x="355" y="96" width="290" height="46" rx="16" fill="#f472b6"/><rect x="355" y="126" width="290" height="16" fill="#f472b6"/>
  <text x="377" y="128" font-size="22" font-weight="700" fill="#fff">2일차</text>
  <text x="377" y="180" font-size="21" fill="#3f3a4a">불교식 입관</text>
  <text x="377" y="214" font-size="21" fill="#3f3a4a">본격 조문</text>
  <text x="377" y="248" font-size="18" fill="#7c7488">저녁: 발인 인원·동선 확정</text>

  <rect x="670" y="96" width="290" height="170" rx="16" fill="#fff" stroke="#e7dccb" stroke-width="2"/>
  <rect x="670" y="96" width="290" height="46" rx="16" fill="#f59e0b"/><rect x="670" y="126" width="290" height="16" fill="#f59e0b"/>
  <text x="692" y="128" font-size="22" font-weight="700" fill="#fff">3일차</text>
  <text x="692" y="180" font-size="21" fill="#3f3a4a">새벽 발인</text>
  <text x="692" y="214" font-size="21" fill="#3f3a4a">장거리 운구 이동</text>
  <text x="692" y="248" font-size="18" fill="#7c7488">봉안당 안치로 마무리</text>
</g>
<!-- 경로 -->
<path d="M190 420 C 330 400, 420 520, 560 500 S 760 440, 820 520" fill="none" stroke="#d9cfe6" stroke-width="22" stroke-linecap="round"/>
<path class="rd" d="M190 420 C 330 400, 420 520, 560 500 S 760 440, 820 520" fill="none" stroke="#7c3aed" stroke-width="4" stroke-dasharray="18 12"/>
<circle class="pl" cx="190" cy="420" r="10" fill="#7c3aed"/>
<circle class="pl" cx="820" cy="520" r="10" fill="#f59e0b"/>
<g class="car"><rect x="-22" y="-12" width="44" height="24" rx="7" fill="#3b2f55"/><rect x="6" y="-8" width="12" height="9" rx="2" fill="#c4b5fd"/></g>
<g class="t">
  <text x="120" y="380" font-size="22" font-weight="700" fill="#3b2f55">파주한빛장례식장</text>
  <text x="120" y="462" font-size="18" fill="#6b6478">경기 파주 · 새벽 출발</text>
  <text x="640" y="574" font-size="22" font-weight="700" fill="#b45309">홍성추모공원 봉안당</text>
  <text x="640" y="602" font-size="18" fill="#6b6478">충남 홍성군 금마면</text>
  <rect x="380" y="330" width="260" height="56" rx="28" fill="#fff" stroke="#e7dccb" stroke-width="2"/>
  <text x="510" y="366" font-size="19" fill="#3f3a4a" text-anchor="middle">차로 2시간 넘는 거리</text>
</g>
</svg>
