<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="전화 한 통으로 시작해 장례 후 한 번 정산하는 후불제 상조의 흐름">
<style>
  .t{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  @keyframes glow{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
  @keyframes ring{0%,60%,100%{transform:rotate(0)}65%{transform:rotate(-8deg)}70%{transform:rotate(8deg)}75%{transform:rotate(-6deg)}80%{transform:rotate(0)}}
  @keyframes wave{0%{opacity:0;transform:scale(.6)}40%{opacity:.8}100%{opacity:0;transform:scale(1.4)}}
  @keyframes dash{to{stroke-dashoffset:-40}}
  @keyframes pop{0%,35%{transform:scale(0);opacity:0}55%{transform:scale(1.1);opacity:1}65%,100%{transform:scale(1);opacity:1}}
  @keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
  .flame{transform-origin:1040px 250px;animation:glow 3s ease-in-out infinite}
  .ph{transform-origin:250px 380px;animation:ring 4s ease-in-out infinite}
  .w1{transform-origin:250px 380px;animation:wave 2.6s ease-out infinite}
  .w2{transform-origin:250px 380px;animation:wave 2.6s ease-out 1.3s infinite}
  .path{stroke-dasharray:14 12;animation:dash 2.4s linear infinite}
  .rc{transform-origin:720px 400px;animation:pop 6s ease-out infinite}
  .fl{transform-origin:950px 520px;animation:sway 6s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdf6ec"/><stop offset="1" stop-color="#e8eefc"/></linearGradient>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="1100" cy="80" r="170" fill="#dbe4f7" opacity=".7"/>
<circle cx="80" cy="600" r="150" fill="#fde9c4" opacity=".5"/>

<text x="80" y="118" class="t" font-size="58" font-weight="900" fill="#14224a">후불제 상조, 이렇게 진행됩니다</text>
<text x="82" y="170" class="t" font-size="27" font-weight="500" fill="#5b6785">가입·월 납입 없이 — 필요할 때 부르고, 장례 후 정산</text>

<!-- 전화 -->
<circle class="w1" cx="250" cy="380" r="92" fill="none" stroke="#7c93c9" stroke-width="4"/>
<circle class="w2" cx="250" cy="380" r="92" fill="none" stroke="#7c93c9" stroke-width="4"/>
<g class="ph">
  <rect x="205" y="300" width="90" height="160" rx="16" fill="#14224a"/>
  <rect x="215" y="318" width="70" height="112" rx="6" fill="#e8eefc"/>
  <circle cx="250" cy="446" r="7" fill="#e8eefc"/>
  <text x="250" y="382" text-anchor="middle" class="t" font-size="22" font-weight="900" fill="#14224a">24h</text>
</g>
<text x="250" y="525" text-anchor="middle" class="t" font-size="26" font-weight="700" fill="#14224a">① 전화 한 통</text>

<!-- 경로 -->
<path class="path" d="M330 380 C 450 300, 560 300, 640 380" fill="none" stroke="#b9a37a" stroke-width="5"/>

<!-- 영수증 -->
<g class="rc">
  <rect x="650" y="300" width="140" height="190" rx="10" fill="#fff" stroke="#c9d3ea" stroke-width="3"/>
  <rect x="672" y="330" width="96" height="10" rx="5" fill="#c9d3ea"/>
  <rect x="672" y="356" width="72" height="10" rx="5" fill="#c9d3ea"/>
  <rect x="672" y="382" width="88" height="10" rx="5" fill="#c9d3ea"/>
  <line x1="672" y1="418" x2="768" y2="418" stroke="#14224a" stroke-width="3"/>
  <path d="M690 448 l16 16 l32 -34" fill="none" stroke="#2f855a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text x="720" y="545" text-anchor="middle" class="t" font-size="26" font-weight="700" fill="#14224a">② 장례 후 한 번 정산</text>

<!-- 촛불 -->
<rect x="1018" y="280" width="44" height="140" rx="6" fill="#fff8e7" stroke="#e5d6b2" stroke-width="3"/>
<line x1="1040" y1="280" x2="1040" y2="266" stroke="#5b4a2a" stroke-width="3"/>
<ellipse class="flame" cx="1040" cy="248" rx="14" ry="24" fill="#f6b73c"/>
<ellipse cx="1040" cy="254" rx="6" ry="11" fill="#fff3c4"/>
<rect x="1000" y="420" width="80" height="12" rx="6" fill="#e5d6b2"/>

<!-- 국화 -->
<g class="fl">
  <line x1="950" y1="600" x2="950" y2="520" stroke="#5f8a5a" stroke-width="5"/>
  <g fill="#fffaf0" stroke="#e7dcc4" stroke-width="2">
    <ellipse cx="950" cy="496" rx="9" ry="24"/>
    <ellipse cx="950" cy="496" rx="9" ry="24" transform="rotate(45 950 520)"/>
    <ellipse cx="950" cy="496" rx="9" ry="24" transform="rotate(90 950 520)"/>
    <ellipse cx="950" cy="496" rx="9" ry="24" transform="rotate(135 950 520)"/>
    <ellipse cx="950" cy="496" rx="9" ry="24" transform="rotate(180 950 520)"/>
    <ellipse cx="950" cy="496" rx="9" ry="24" transform="rotate(225 950 520)"/>
    <ellipse cx="950" cy="496" rx="9" ry="24" transform="rotate(270 950 520)"/>
    <ellipse cx="950" cy="496" rx="9" ry="24" transform="rotate(315 950 520)"/>
  </g>
  <circle cx="950" cy="520" r="10" fill="#f2c94c"/>
</g>
</svg>
