<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="후불제 상조 진행 6단계: 상담 전화, 출동과 안치, 견적 확인과 계약, 빈소와 장례 진행, 발인과 화장·장지, 장례 후 정산">
<style>
  .t{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  @keyframes rise{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
  @keyframes dash{to{stroke-dashoffset:-36}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}
  .s{opacity:0;animation:rise .9s ease-out forwards}
  .s1{animation-delay:.2s}.s2{animation-delay:.7s}.s3{animation-delay:1.2s}
  .s4{animation-delay:1.7s}.s5{animation-delay:2.2s}.s6{animation-delay:2.7s}
  .ln{stroke-dasharray:12 12;animation:dash 2.4s linear infinite}
  .hl{animation:pulse 3s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.s{opacity:1}}
</style>
<rect width="1200" height="560" fill="#fbf7f0"/>
<text x="600" y="58" text-anchor="middle" class="t" font-size="32" font-weight="900" fill="#14224a">후불제 상조 진행 순서</text>
<text x="600" y="94" text-anchor="middle" class="t" font-size="20" font-weight="500" fill="#6b7280">비용은 맨 마지막, 장례를 마친 뒤 한 번 정산하는 구조</text>

<!-- 연결선 -->
<path class="ln" d="M330 210 H 470 M730 210 H 870" stroke="#b9a37a" stroke-width="4" fill="none"/>
<path class="ln" d="M1000 285 C 1100 330, 1100 360, 1000 395" stroke="#b9a37a" stroke-width="4" fill="none"/>
<path class="ln" d="M870 440 H 730 M470 440 H 330" stroke="#b9a37a" stroke-width="4" fill="none"/>

<!-- 1행 -->
<g class="s s1">
  <rect x="70" y="140" width="260" height="140" rx="18" fill="#fff" stroke="#d6dcec" stroke-width="2"/>
  <circle cx="112" cy="182" r="24" fill="#14224a"/><text x="112" y="190" text-anchor="middle" class="t" font-size="22" font-weight="900" fill="#fff">1</text>
  <text x="150" y="190" class="t" font-size="24" font-weight="800" fill="#14224a">상담 전화</text>
  <text x="96" y="234" class="t" font-size="18" fill="#4b5563">임종 직후 또는 임종이</text>
  <text x="96" y="260" class="t" font-size="18" fill="#4b5563">가까울 때 24시간 연락</text>
</g>
<g class="s s2">
  <rect x="470" y="140" width="260" height="140" rx="18" fill="#fff" stroke="#d6dcec" stroke-width="2"/>
  <circle cx="512" cy="182" r="24" fill="#14224a"/><text x="512" y="190" text-anchor="middle" class="t" font-size="22" font-weight="900" fill="#fff">2</text>
  <text x="550" y="190" class="t" font-size="24" font-weight="800" fill="#14224a">출동·안치</text>
  <text x="496" y="234" class="t" font-size="18" fill="#4b5563">장례지도사 출동, 고인을</text>
  <text x="496" y="260" class="t" font-size="18" fill="#4b5563">장례식장으로 이송·안치</text>
</g>
<g class="s s3">
  <rect class="hl" x="864" y="134" width="272" height="152" rx="22" fill="none" stroke="#f2c94c" stroke-width="4"/>
  <rect x="870" y="140" width="260" height="140" rx="18" fill="#fff" stroke="#d6dcec" stroke-width="2"/>
  <circle cx="912" cy="182" r="24" fill="#b7791f"/><text x="912" y="190" text-anchor="middle" class="t" font-size="22" font-weight="900" fill="#fff">3</text>
  <text x="950" y="190" class="t" font-size="24" font-weight="800" fill="#14224a">견적·계약</text>
  <text x="896" y="234" class="t" font-size="18" fill="#4b5563">품목·옵션별 금액을</text>
  <text x="896" y="260" class="t" font-size="18" fill="#4b5563">서면으로 확인 후 진행</text>
</g>

<!-- 2행 (오른쪽에서 왼쪽) -->
<g class="s s4">
  <rect x="870" y="370" width="260" height="140" rx="18" fill="#fff" stroke="#d6dcec" stroke-width="2"/>
  <circle cx="912" cy="412" r="24" fill="#14224a"/><text x="912" y="420" text-anchor="middle" class="t" font-size="22" font-weight="900" fill="#fff">4</text>
  <text x="950" y="420" class="t" font-size="24" font-weight="800" fill="#14224a">빈소·장례</text>
  <text x="896" y="464" class="t" font-size="18" fill="#4b5563">조문 준비, 입관, 상복·</text>
  <text x="896" y="490" class="t" font-size="18" fill="#4b5563">도우미 등 진행 지원</text>
</g>
<g class="s s5">
  <rect x="470" y="370" width="260" height="140" rx="18" fill="#fff" stroke="#d6dcec" stroke-width="2"/>
  <circle cx="512" cy="412" r="24" fill="#14224a"/><text x="512" y="420" text-anchor="middle" class="t" font-size="22" font-weight="900" fill="#fff">5</text>
  <text x="550" y="420" class="t" font-size="24" font-weight="800" fill="#14224a">발인·장지</text>
  <text x="496" y="464" class="t" font-size="18" fill="#4b5563">운구, 화장시설 이동,</text>
  <text x="496" y="490" class="t" font-size="18" fill="#4b5563">봉안·자연장 등 안치</text>
</g>
<g class="s s6">
  <rect class="hl" x="64" y="364" width="272" height="152" rx="22" fill="none" stroke="#2f855a" stroke-width="4"/>
  <rect x="70" y="370" width="260" height="140" rx="18" fill="#fff" stroke="#d6dcec" stroke-width="2"/>
  <circle cx="112" cy="412" r="24" fill="#2f855a"/><text x="112" y="420" text-anchor="middle" class="t" font-size="22" font-weight="900" fill="#fff">6</text>
  <text x="150" y="420" class="t" font-size="24" font-weight="800" fill="#14224a">정산</text>
  <text x="96" y="464" class="t" font-size="18" fill="#4b5563">견적서와 실제 사용</text>
  <text x="96" y="490" class="t" font-size="18" fill="#4b5563">내역을 맞춰 보고 결제</text>
</g>
</svg>
