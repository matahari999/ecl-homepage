<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="시간에 따라 선불제는 매달 납입금이 쌓이고, 후불제는 장례가 생긴 시점에만 비용이 발생하는 그래프">
<style>
  .t{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  @keyframes grow{0%{transform:scaleY(0)}100%{transform:scaleY(1)}}
  @keyframes show{0%,70%{opacity:0;transform:translateY(20px)}85%,100%{opacity:1;transform:translateY(0)}}
  @keyframes dash{to{stroke-dashoffset:0}}
  .b{transform-box:fill-box;transform-origin:bottom;animation:grow .5s ease-out both}
  .ev{animation:show 6s ease-out infinite}
  .ln{stroke-dasharray:6 10}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="640" fill="#ffffff"/>
<text x="60" y="70" class="t" font-size="34" font-weight="900" fill="#0f1b3d">돈이 나가는 시점 비교</text>
<g class="t" font-size="22" font-weight="700">
  <rect x="760" y="44" width="26" height="26" rx="6" fill="#f59e0b"/><text x="796" y="66" fill="#334155">선불제 (매달 납입)</text>
  <rect x="990" y="44" width="26" height="26" rx="6" fill="#2563eb"/><text x="1026" y="66" fill="#334155">후불제</text>
</g>
<!-- 축 -->
<line x1="90" y1="540" x2="1140" y2="540" stroke="#94a3b8" stroke-width="3"/>
<line x1="90" y1="120" x2="90" y2="540" stroke="#94a3b8" stroke-width="3"/>
<text x="1140" y="585" text-anchor="end" class="t" font-size="22" fill="#64748b">시간 →</text>
<text x="70" y="130" text-anchor="end" class="t" font-size="20" fill="#64748b">누적</text>
<!-- 선불 계단 막대 -->
<g fill="#f59e0b">
  <rect class="b" style="animation-delay:.0s" x="110" y="510" width="44" height="30" rx="4"/>
  <rect class="b" style="animation-delay:.2s" x="164" y="480" width="44" height="60" rx="4"/>
  <rect class="b" style="animation-delay:.4s" x="218" y="450" width="44" height="90" rx="4"/>
  <rect class="b" style="animation-delay:.6s" x="272" y="420" width="44" height="120" rx="4"/>
  <rect class="b" style="animation-delay:.8s" x="326" y="390" width="44" height="150" rx="4"/>
  <rect class="b" style="animation-delay:1.0s" x="380" y="360" width="44" height="180" rx="4"/>
  <rect class="b" style="animation-delay:1.2s" x="434" y="330" width="44" height="210" rx="4"/>
  <rect class="b" style="animation-delay:1.4s" x="488" y="300" width="44" height="240" rx="4"/>
  <rect class="b" style="animation-delay:1.6s" x="542" y="270" width="44" height="270" rx="4"/>
  <rect class="b" style="animation-delay:1.8s" x="596" y="240" width="44" height="300" rx="4"/>
  <rect class="b" style="animation-delay:2.0s" x="650" y="210" width="44" height="330" rx="4"/>
  <rect class="b" style="animation-delay:2.2s" x="704" y="180" width="44" height="360" rx="4"/>
</g>
<text x="110" y="130" class="t" font-size="22" font-weight="700" fill="#b45309">수년간 매달 납입 → 업체 폐업 시 보통 절반 수준 보상</text>
<!-- 후불: 0 유지 -->
<line x1="110" y1="536" x2="900" y2="536" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
<text x="560" y="575" text-anchor="middle" class="t" font-size="21" font-weight="700" fill="#1d4ed8">후불제: 그동안 내는 돈 0원</text>
<!-- 장례 시점 -->
<line class="ln" x1="930" y1="140" x2="930" y2="540" stroke="#64748b" stroke-width="3"/>
<g class="ev">
  <rect x="908" y="260" width="44" height="280" rx="4" fill="#2563eb"/>
  <rect x="960" y="250" width="200" height="104" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="1060" y="292" text-anchor="middle" class="t" font-size="24" font-weight="900" fill="#1d4ed8">장례 발생</text>
  <text x="1060" y="330" text-anchor="middle" class="t" font-size="20" font-weight="700" fill="#334155">쓴 만큼만 정산</text>
</g>
</svg>
