<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="새벽 도로를 나란히 달리는 운구 리무진과 유가족 버스 그림">
<style>
  .t{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
  @keyframes road{from{transform:translateX(0)}to{transform:translateX(-160px)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
  @keyframes glow{0%,100%{opacity:.35}50%{opacity:.8}}
  @keyframes led{0%,100%{opacity:.75}50%{opacity:1}}
  .s1{animation:tw 2.6s ease-in-out infinite}.s2{animation:tw 3.4s ease-in-out .8s infinite}.s3{animation:tw 4.2s ease-in-out 1.6s infinite}
  .rd{animation:road 1.6s linear infinite}
  .car{animation:bob 1.2s ease-in-out infinite}.bus{animation:bob 1.4s ease-in-out .3s infinite}
  .gl{animation:glow 3s ease-in-out infinite}
  .led{animation:led 2s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e1a32"/><stop offset=".7" stop-color="#2a3a5e"/><stop offset="1" stop-color="#4a3f63"/></linearGradient>
  <radialGradient id="beam" cx="0" cy=".5" r="1"><stop offset="0" stop-color="#fde68a" stop-opacity=".55"/><stop offset="1" stop-color="#fde68a" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<g fill="#fef9c3">
  <circle class="s1" cx="640" cy="60" r="3"/><circle class="s2" cx="760" cy="120" r="2.5"/><circle class="s3" cx="880" cy="70" r="2"/>
  <circle class="s2" cx="1120" cy="110" r="3"/><circle class="s1" cx="1010" cy="40" r="2"/><circle class="s3" cx="560" cy="150" r="2"/>
</g>
<!-- 십자가 -->
<g fill="#e2e8f0" opacity=".8"><rect x="1092" y="160" width="14" height="78" rx="3"/><rect x="1070" y="182" width="58" height="12" rx="3"/></g>
<!-- 먼 언덕 -->
<path d="M0 420 Q200 360 420 400 T860 380 T1200 395 V470 H0Z" fill="#1d2944"/>
<!-- 도로 -->
<rect x="0" y="470" width="1200" height="160" fill="#151d2e"/>
<g class="rd"><g fill="#cbd5e1" opacity=".55">
  <rect x="0" y="545" width="80" height="6" rx="3"/><rect x="160" y="545" width="80" height="6" rx="3"/><rect x="320" y="545" width="80" height="6" rx="3"/><rect x="480" y="545" width="80" height="6" rx="3"/><rect x="640" y="545" width="80" height="6" rx="3"/><rect x="800" y="545" width="80" height="6" rx="3"/><rect x="960" y="545" width="80" height="6" rx="3"/><rect x="1120" y="545" width="80" height="6" rx="3"/><rect x="1280" y="545" width="80" height="6" rx="3"/>
</g></g>
<!-- 버스 (뒤) -->
<g class="bus">
  <rect x="560" y="410" width="300" height="104" rx="14" fill="#e2e8f0"/>
  <rect x="560" y="470" width="300" height="10" fill="#64748b"/>
  <g fill="#334155"><rect x="578" y="424" width="44" height="34" rx="5"/><rect x="630" y="424" width="44" height="34" rx="5"/><rect x="682" y="424" width="44" height="34" rx="5"/><rect x="734" y="424" width="44" height="34" rx="5"/><rect x="786" y="424" width="56" height="34" rx="5"/></g>
  <circle cx="610" cy="516" r="20" fill="#0f172a"/><circle cx="610" cy="516" r="8" fill="#94a3b8"/>
  <circle cx="808" cy="516" r="20" fill="#0f172a"/><circle cx="808" cy="516" r="8" fill="#94a3b8"/>
  <path class="gl" d="M860 470 L1000 440 L1000 520 Z" fill="url(#beam)"/>
</g>
<!-- 리무진 (앞) -->
<g class="car">
  <path d="M120 520 L120 486 Q124 466 150 462 L210 458 L250 432 Q262 426 280 426 L470 426 Q492 426 504 440 L524 462 Q548 466 552 486 L552 520 Z" fill="#0b0f19" stroke="#475569" stroke-width="2"/>
  <rect x="268" y="436" width="196" height="26" rx="5" fill="#111827" stroke="#334155"/>
  <text class="t led" x="366" y="455" text-anchor="middle" font-size="15" font-weight="700" fill="#e0e7ff" letter-spacing="1">이음케어라이프</text>
  <rect x="120" y="492" width="432" height="4" fill="#94a3b8" opacity=".6"/>
  <circle cx="190" cy="522" r="22" fill="#020617"/><circle cx="190" cy="522" r="9" fill="#94a3b8"/>
  <circle cx="480" cy="522" r="22" fill="#020617"/><circle cx="480" cy="522" r="9" fill="#94a3b8"/>
  <path class="gl" d="M552 488 L700 460 L700 530 Z" fill="url(#beam)"/>
</g>
<!-- 제목 -->
<text class="t" x="70" y="140" font-size="58" font-weight="800" fill="#ffffff">신촌세브란스병원장례식장</text>
<text class="t" x="70" y="204" font-size="34" font-weight="700" fill="#fcd34d">기독교 4일장 · 리무진과 버스로 마지막 길</text>
<text class="t" x="70" y="254" font-size="24" fill="#cbd5e1">승화원 화장 → 서현추모공원 봉안 · 진행 사례</text>
</svg>
