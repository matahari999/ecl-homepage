<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="수목장 비용이 나가는 시점 타임라인: 계약할 때 사용료·조성과 안치비·명패, 사용 기간 동안 관리비, 추가 안치할 때 안치비, 기간이 끝날 때 연장 비용">
<style>
  .t{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  @keyframes pop{0%,100%{opacity:.7}50%{opacity:1}}
  @keyframes run{from{stroke-dashoffset:40}to{stroke-dashoffset:0}}
  .d1{animation:pop 4s ease-in-out infinite}.d2{animation:pop 4s ease-in-out 1s infinite}.d3{animation:pop 4s ease-in-out 2s infinite}.d4{animation:pop 4s ease-in-out 3s infinite}
  .ln{stroke-dasharray:12 8;animation:run 3s linear infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="560" rx="20" fill="#13203d"/>
<text class="t" x="600" y="62" text-anchor="middle" font-size="34" font-weight="700" fill="#ffffff">수목장 비용은 언제, 무엇으로 나갈까</text>
<text class="t" x="600" y="102" text-anchor="middle" font-size="21" fill="#cbd5e1">총액보다 '어느 시점에 어떤 항목이 붙는지'를 먼저 보세요</text>
<line class="ln" x1="150" y1="200" x2="1050" y2="200" stroke="#fde68a" stroke-width="4"/>
<g class="d1"><circle cx="150" cy="200" r="22" fill="#fde68a"/><text class="t" x="150" y="208" text-anchor="middle" font-size="22" font-weight="700" fill="#13203d">1</text></g>
<g class="d2"><circle cx="450" cy="200" r="22" fill="#fde68a"/><text class="t" x="450" y="208" text-anchor="middle" font-size="22" font-weight="700" fill="#13203d">2</text></g>
<g class="d3"><circle cx="750" cy="200" r="22" fill="#fde68a"/><text class="t" x="750" y="208" text-anchor="middle" font-size="22" font-weight="700" fill="#13203d">3</text></g>
<g class="d4"><circle cx="1050" cy="200" r="22" fill="#fde68a"/><text class="t" x="1050" y="208" text-anchor="middle" font-size="22" font-weight="700" fill="#13203d">4</text></g>
<g class="t">
  <rect x="40" y="250" width="240" height="250" rx="14" fill="#1f3157"/>
  <text x="160" y="292" text-anchor="middle" font-size="25" font-weight="700" fill="#fde68a">계약할 때</text>
  <text x="160" y="342" text-anchor="middle" font-size="21" fill="#ffffff">사용료(분양가)</text>
  <text x="160" y="380" text-anchor="middle" font-size="21" fill="#ffffff">조성·안치비</text>
  <text x="160" y="418" text-anchor="middle" font-size="21" fill="#ffffff">명패(표지)</text>
  <text x="160" y="466" text-anchor="middle" font-size="17" fill="#cbd5e1">포함 여부 확인</text>

  <rect x="330" y="250" width="240" height="250" rx="14" fill="#1f3157"/>
  <text x="450" y="292" text-anchor="middle" font-size="25" font-weight="700" fill="#fde68a">사용 기간 동안</text>
  <text x="450" y="342" text-anchor="middle" font-size="21" fill="#ffffff">관리비</text>
  <text x="450" y="380" text-anchor="middle" font-size="21" fill="#ffffff">(매년 또는 선납)</text>
  <text x="450" y="466" text-anchor="middle" font-size="17" fill="#cbd5e1">몇 년치 포함인지</text>

  <rect x="630" y="250" width="240" height="250" rx="14" fill="#1f3157"/>
  <text x="750" y="292" text-anchor="middle" font-size="25" font-weight="700" fill="#fde68a">가족을 더 모실 때</text>
  <text x="750" y="342" text-anchor="middle" font-size="21" fill="#ffffff">추가 안치비</text>
  <text x="750" y="380" text-anchor="middle" font-size="21" fill="#ffffff">명패 추가</text>
  <text x="750" y="466" text-anchor="middle" font-size="17" fill="#cbd5e1">계약 인원 안인지</text>

  <rect x="920" y="250" width="240" height="250" rx="14" fill="#1f3157"/>
  <text x="1040" y="292" text-anchor="middle" font-size="25" font-weight="700" fill="#fde68a">기간이 끝날 때</text>
  <text x="1040" y="342" text-anchor="middle" font-size="21" fill="#ffffff">연장 비용</text>
  <text x="1040" y="380" text-anchor="middle" font-size="21" fill="#ffffff">연장 가능 횟수</text>
  <text x="1040" y="466" text-anchor="middle" font-size="17" fill="#cbd5e1">계약서에 명시됐는지</text>
</g>
</svg>
