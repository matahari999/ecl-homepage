<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="밤하늘 아래 언덕 위에 크기가 다른 나무 세 그루가 서 있고, 나무마다 작은 명패가 매달린 수목장 그림">
<style>
  .t{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
  @keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
  @keyframes tag{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
  .s1{animation:tw 3s ease-in-out infinite}.s2{animation:tw 4s ease-in-out 1s infinite}.s3{animation:tw 5s ease-in-out 2s infinite}
  .tr1{transform-origin:330px 470px;animation:sway 8s ease-in-out infinite}
  .tr2{transform-origin:600px 450px;animation:sway 9s ease-in-out 1s infinite}
  .tr3{transform-origin:870px 470px;animation:sway 7s ease-in-out 2s infinite}
  .tg{transform-box:fill-box;transform-origin:50% 0;animation:tag 5s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1530"/><stop offset="1" stop-color="#243556"/></linearGradient>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle class="s1" cx="120" cy="230" r="2.5" fill="#fff"/><circle class="s2" cx="1080" cy="220" r="2" fill="#fff"/><circle class="s3" cx="1010" cy="300" r="2.5" fill="#fff"/><circle class="s1" cx="200" cy="320" r="1.8" fill="#fff"/><circle class="s2" cx="1140" cy="340" r="2" fill="#fff"/>
<text class="t" x="600" y="92" text-anchor="middle" font-size="58" font-weight="700" fill="#ffffff">수목장 종류와 비용 구조</text>
<text class="t" x="600" y="146" text-anchor="middle" font-size="28" fill="#fde68a">공동목·가족목 차이와 견적 항목 5가지</text>
<path d="M0 520 Q300 430 600 455 T1200 500 V630 H0Z" fill="#1d3a2e"/>
<path d="M0 560 Q350 500 700 530 T1200 545 V630 H0Z" fill="#163024"/>
<g class="tr1">
  <rect x="322" y="390" width="16" height="85" rx="4" fill="#6b4a2f"/>
  <circle cx="330" cy="360" r="55" fill="#2f6b4c"/><circle cx="295" cy="385" r="35" fill="#3b7d58"/><circle cx="365" cy="385" r="35" fill="#3b7d58"/>
  <g class="tg"><line x1="350" y1="402" x2="350" y2="418" stroke="#f5efe0" stroke-width="2"/><rect x="340" y="418" width="22" height="14" rx="2" fill="#f5efe0"/></g>
</g>
<g class="tr2">
  <rect x="590" y="330" width="20" height="125" rx="5" fill="#6b4a2f"/>
  <circle cx="600" cy="290" r="78" fill="#2f6b4c"/><circle cx="545" cy="320" r="50" fill="#3b7d58"/><circle cx="655" cy="320" r="50" fill="#3b7d58"/>
  <g class="tg"><line x1="620" y1="360" x2="620" y2="378" stroke="#f5efe0" stroke-width="2"/><rect x="608" y="378" width="26" height="16" rx="2" fill="#f5efe0"/></g>
</g>
<g class="tr3">
  <rect x="863" y="400" width="14" height="72" rx="4" fill="#6b4a2f"/>
  <circle cx="870" cy="375" r="45" fill="#2f6b4c"/><circle cx="842" cy="395" r="28" fill="#3b7d58"/><circle cx="898" cy="395" r="28" fill="#3b7d58"/>
  <g class="tg"><line x1="888" y1="410" x2="888" y2="424" stroke="#f5efe0" stroke-width="2"/><rect x="878" y="424" width="20" height="13" rx="2" fill="#f5efe0"/></g>
</g>
<g fill="#f5efe0" opacity=".9">
  <circle cx="200" cy="545" r="6"/><circle cx="212" cy="540" r="5"/><circle cx="1000" cy="540" r="6"/><circle cx="1012" cy="546" r="5"/>
</g>
</svg>
